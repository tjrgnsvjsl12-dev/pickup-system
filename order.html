<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오더 기록</title>
<style>
:root{--bg:#f4f5f7;--surf:#fff;--ink:#101828;--ink2:#344054;--mut:#667085;--line:#e4e7ec;--pri:#2f55d4;--pri2:#2444b8;--pri-s:#eef2ff;--ok:#0e7a43;--ok-s:#e8f6ee;--warn:#b54708;--warn-s:#fff4e5;--bad:#b42318;--bad-s:#fdecea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;height:58px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}.brand b{font-size:17px;letter-spacing:-.01em;white-space:nowrap}.brand span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{width:auto;min-width:120px;padding:6px 10px;min-height:38px}
select,input,textarea,button{font:inherit}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--ink);width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
select:focus,input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
textarea{resize:vertical}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 15px;cursor:pointer;min-height:40px;font-weight:550;color:var(--ink2);transition:background .12s,border-color .12s}
button:hover{background:#f9fafb;border-color:#d0d5dd}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.pri:hover{background:var(--pri2)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.ok:hover{background:#0b6537}
button.bad{color:var(--bad);border-color:#f3c4bf;background:#fff}button.bad:hover{background:var(--bad-s)}
button.sm{min-height:30px;padding:3px 11px;font-size:13px;border-radius:8px}
button.ghost{border-color:transparent;background:transparent;color:var(--mut)}button.ghost:hover{background:#eceef2}
main{max-width:1080px;margin:0 auto;padding:18px 20px 70px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #1018280a}
.ct{font-size:13px;font-weight:650;color:var(--mut);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}.row>.fix{flex:none;min-width:0}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:650;white-space:nowrap}
.c-s1{background:#eef2ff;color:#2f55d4}.c-s2{background:var(--warn-s);color:var(--warn)}.c-s3{background:#eef2ff;color:#2f55d4}.c-s4{background:var(--warn-s);color:var(--warn)}.c-s5{background:#fdf0f7;color:#a3166b}.c-done{background:var(--ok-s);color:var(--ok)}.c-void{background:#f2f4f7;color:#667085}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eef0f3;vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600;padding-top:4px}tr:last-child td{border-bottom:none}
.mut{color:var(--mut)}.small{font-size:12.5px}.bold{font-weight:650}
.log{border-left:2px solid var(--line);margin-left:5px;padding-left:14px;max-height:420px;overflow:auto}.log div{margin:9px 0;font-size:13.5px}
.box{padding:10px 13px;border-radius:10px;margin:8px 0}
.warn{background:var(--warn-s);border:1px solid #fed7aa;color:var(--warn)}.err{background:var(--bad-s);border:1px solid #fecdca;color:var(--bad)}.okbox{background:var(--ok-s);border:1px solid #abefc6;color:var(--ok)}
.raw{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:flex-start;justify-content:center;z-index:20;padding:12px;overflow:auto}
.modal>div{background:#fff;border-radius:18px;padding:22px;width:min(660px,100%);margin-top:20px;box-shadow:0 20px 60px #10182833}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:18px;padding:5px 13px;cursor:pointer;background:#fff;font-size:13.5px;font-weight:550;color:var(--ink2)}
.pill.on{background:var(--pri-s);border-color:#c7d2fe;color:var(--pri)}
pre{white-space:pre-wrap;background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.7 inherit}
.big{display:block;width:100%;min-height:50px;font-size:16px;font-weight:650;text-align:left;padding:10px 16px;margin-top:8px}
button.warnb{background:var(--warn-s);border-color:#fdba74;color:var(--warn)}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:650}.tag.me{background:var(--ok);color:#fff}.tag.rd{background:#ffedd5;color:#9a3412}
.stt{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:650;white-space:nowrap}.stt.ok{background:var(--ok-s);color:var(--ok)}.stt.lower{background:var(--warn-s);color:var(--warn)}.stt.drop{background:#f2f4f7;color:var(--mut)}
.herobtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;font-size:17px;margin-bottom:16px;border-radius:14px;box-shadow:0 4px 14px #2f55d433}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}.sec i{font-style:normal;color:var(--mut);font-weight:600}
.ocard{background:#fff;border:1px solid var(--line);border-left:4px solid #c7cdd8;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px #1018280a;transition:box-shadow .12s,transform .12s}
.ocard:hover{box-shadow:0 6px 18px #10182814;transform:translateY(-1px)}
.ocard.mine{border-left-color:var(--ok);background:linear-gradient(90deg,#f3fbf6,#fff 40%)}
.ocard.st-s2,.ocard.st-s4{border-left-color:#f59e0b}.ocard.st-s5{border-left-color:#c026d3}.ocard.st-done{border-left-color:#98a2b3;opacity:.92}.ocard.st-void{border-left-color:#d0d5dd;opacity:.8}
.ocard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ocard .li{font-size:16px;margin:3px 0}.ocard .li s{color:var(--mut)}
.ocard .nx{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--mut)}.ocard.mine .nx{color:var(--ok);font-weight:650}
.titlebar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:6px 0 16px}
.titlebar h2{margin:2px 0 0;font-size:22px;letter-spacing:-.015em;line-height:1.3}.eyebrow{font-size:12.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}.colside{order:-1}}
.prog{list-style:none;margin:0;padding:0}.prog li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;color:var(--mut);font-size:14px}
.prog .dot{width:18px;height:18px;border-radius:50%;border:2px solid #d0d5dd;flex:none;margin-top:2px;background:#fff}
.prog li.past{color:var(--ink2)}.prog li.past .dot{background:var(--ok);border-color:var(--ok)}
.prog li.cur{color:var(--ink);font-weight:700}.prog li.cur .dot{border-color:var(--pri);background:var(--pri);box-shadow:0 0 0 4px var(--pri-s)}
.prog .who{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.act{padding:0;overflow:hidden}.act .acthd{display:flex;align-items:center;gap:8px;padding:11px 18px;font-weight:700;font-size:14px}.act .acthd.mine{background:var(--ok);color:#fff}.act .acthd.wait{background:#f2f4f7;color:var(--ink2)}.act .acthd.done{background:var(--ok-s);color:var(--ok)}.act .actbd{padding:18px}
.act.mine{border:1.5px solid var(--ok)}
.hero table td.nmcell{font-weight:650;font-size:16px}.hero table td.qcell{font-weight:650;font-size:16px;white-space:nowrap}
.hero tr.dropped td{color:var(--mut)}.hero tr.dropped .nmcell{text-decoration:line-through}
.nrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fafbfc}
.nrow .nm{flex:1 1 100%}.nrow .qt{width:92px;flex:none}.nrow select{width:62px;flex:none;padding:7px 4px}.nrow .pr{width:100px;flex:none}.nrow .cu{width:76px}
.fchip{display:inline-block;border:1px solid #c7d2fe;background:var(--pri-s);color:var(--pri);border-radius:16px;padding:5px 12px;margin:3px 4px 3px 0;cursor:pointer;font-size:13px;font-weight:550}
.dcrow{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}.dcrow:first-child{padding-top:2px}
.dcrow .nm{font-weight:650;font-size:16px}.dcrow .meta{font-size:13px;color:var(--mut);margin-top:2px}
.dcq{text-align:right}.dcq .px{font-weight:700;font-size:17px}.dcq .sub{font-size:12.5px;color:var(--mut)}
.seg{display:flex;gap:8px;grid-column:1/-1}.seg label{flex:1;margin:0}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 6px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;font-weight:650;background:#fff;color:var(--ink2);transition:all .1s}
.seg span:hover{border-color:#b9c0cc}
.seg input[value=ok]:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.seg input[value=lower]:checked+span{background:#f59e0b;border-color:#f59e0b;color:#fff}
.seg input[value=drop]:checked+span{background:#667085;border-color:#667085;color:#fff}
.tgbox{grid-column:1/-1;display:none;gap:8px;align-items:center}.tgbox span{font-size:13px;color:var(--warn);font-weight:600}
.dcdone{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--mut);align-items:center}
#panel,#menu{position:fixed;right:14px;top:64px;width:min(380px,calc(100vw - 28px));max-height:72vh;overflow:auto;display:none;z-index:9;box-shadow:0 12px 40px #10182822}
</style>
</head>
<body>
<header>
  <div class="brand"><b>오더 기록</b><span>오더 승인</span></div>
  <div id="langWrap" style="display:none"><select id="langSel" onchange="S.langBy=S.langBy||{};S.langBy[S.me]=this.value;save();render()"><option value="ko">한국어</option><option value="zh">中文</option><option value="en">English</option></select></div>
  <span id="who" class="small" style="font-weight:700"></span>
  <button onclick="togglePanel()">알림 <b id="bellN"></b></button>
  <button onclick="toggleMenu()" title="설정">⚙</button>
</header>
<div id="panel" class="card"></div>
<div id="menu" class="card"></div>
<main id="main"></main>
<div class="modal" id="modal"><div id="modalBody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const ST=[
 {k:'s1',n:'① 조사·견적'},
 {k:'s2',n:'② Penny 가격 회신'},
 {k:'s3',n:'③ 서류 준비'},
 {k:'s4',n:'④ Penny 서류 확인'},
 {k:'s5',n:'⑤ 결제승인(재무·CC)'},
 {k:'done',n:'⑥ 완료'}];
const ALL=[...ST,{k:'void',n:'무산'}];
const stName=k=>(ALL.find(s=>s.k===k)||{}).n;
const VOID_REASONS=['가격이 안 맞음','Penny 무응답','Penny 결정: 진행 안 함','물량·재고 없음','업체 연락 안 됨','잘못 등록','기타'];
const COMPANIES=['CH','성신','에잇싱크','부강'];
let FIN={},USERS=[],ROLES={},EDITORS=[];
function applyRoster(list){FIN={};USERS=[];ROLES={};
 list.forEach(u=>{const rs=u.roles||[];ROLES[u.id]=rs;const fc=rs.filter(r=>r.startsWith('fin:')).map(r=>r.slice(4));fc.forEach(c=>{FIN[c]=u.name});
  USERS.push({id:u.id,name:u.name+(fc.length?' ('+fc.join('·')+' 재무)':'')})});
 EDITORS=USERS.filter(u=>ROLES[u.id].includes('edit'))}
const isAdmin=()=>(ROLES[S.real||S.me]||[]).includes('admin');
const isEdit=()=>ROLES[S.me].includes('edit');
const turn=o=>{
 let role;
 if(S.mode==='ding')role='edit';
 else if(o.status==='s1'||o.status==='s3')role='edit';
 else if(o.status==='s2'||o.status==='s4')role='approve';
 else if(o.status==='s5')role=!o.posted?'edit':!o.finOk?'fin':'pay';
 else return {role:null,can:false,lab:''};
 const R=ROLES[S.me];let can=false;
 if(role==='edit')can=R.includes('edit');
 else if(role==='approve')can=R.includes('approve');
 else if(role==='pay')can=R.includes('pay');
 else can=o.company?R.includes('fin:'+o.company):R.some(r=>r.startsWith('fin:'));
 const lab={edit:'조사 담당(과장님·석훈·Chloe)',approve:'Penny',pay:'CC',fin:'재무팀'+(o.company&&FIN[o.company]?' ('+FIN[o.company]+')':'')}[role];
 return {role,can,lab};
};
const mine=o=>!['done','void'].includes(o.status)&&turn(o).can;
const finIds=o=>Object.keys(ROLES).filter(u=>ROLES[u].some(r=>o.company?r==='fin:'+o.company:r.startsWith('fin:')));
function notify(o,ids,text){if(S.mode!=='app')return;[...new Set(ids)].filter(x=>x&&x!==S.me).forEach(u=>S.notifs.unshift({to:u,o:o.id,text:'['+o.no+'] '+text,t:Date.now(),read:false}));save()}
const uname=id=>(USERS.find(u=>u.id===id)||{name:id||'-'}).name;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const DAY=86400000,ago=d=>Date.now()-d*DAY;
const num=v=>Number(String(v||'').replace(/,/g,''))||0;
const FX0=1470;
const fxOf=o=>num(o&&o.fx)||FX0;
const fUSD=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fKRW=n=>'₩'+Math.round(n||0).toLocaleString('ko-KR');
const toKRW=(a,c,fx)=>c==='USD'?num(a)*fx:num(a);
const dual=(a,c,fx)=>c==='USD'?`${fUSD(num(a))} <span class="mut">(≈ ${fKRW(num(a)*fx)})</span>`:`${fKRW(num(a))} <span class="mut">(≈ ${fUSD(num(a)/fx)})</span>`;
const lineKRW=(o,l)=>toKRW(num(l.qty)*num(l.price),l.cur||'KRW',fxOf(o));
const payTotal=o=>(o.pay||[]).reduce((a,l)=>a+lineKRW(o,l),0);
const totTxt=o=>fKRW(payTotal(o))+' ('+fUSD(payTotal(o)/fxOf(o))+')';
const todayStr=()=>{const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()};
const COND={'이하':'≤','정도':'≈','이상':'≥'};
const estTxt=(o,x)=>x.estAmt?`${COND[x.estCond||'정도']} ${dual(x.estAmt,x.estCur||'USD',fxOf(o))}`:'';
const ut=s=>`<span data-nt>${esc(s)}</span>`;
function ensurePay(o){if(!['s3','s4','s5'].includes(o.status))return;if(o.pay&&(o.pay.length||o.payEdited))return;
 const oks=o.items.filter(x=>x.st==='ok'&&x.ap);
 if(oks.length){o.pay=oks.map(x=>({item:x.name,vendor:x.ap.vendor,qty:x.ap.qty||x.qty||'',price:String(x.ap.price),cur:x.ap.cur||'KRW'}));return}
 const cur=o.round||1;const Lq=o.quotes.filter(q=>num(q.price)>0&&(q.round||1)===cur);const by={};
 Lq.forEach(q=>{const k=q.item||'';const kk=toKRW(q.price,q.cur||'KRW',fxOf(o));if(!by[k]||kk<by[k].kk)by[k]={q,kk}});
 o.pay=Object.values(by).map(({q})=>{const it=o.items.find(x=>x.name===q.item)||(o.items.length===1?o.items[0]:null);return {item:q.item||(it?it.name:''),vendor:q.vendor,qty:q.qty||(it?it.qty:''),price:String(q.price),cur:q.cur||'KRW'}})}
function editPay(id,i,f,v){const o=O(id);o.pay[i][f]=v;o.payEdited=true;save();render()}
function delPay(id,i){const o=O(id);o.pay.splice(i,1);o.payEdited=true;save();render()}
function addPay(id){const o=O(id);ensurePay(o);o.pay=o.pay||[];o.payEdited=true;const lq=o.quotes[o.quotes.length-1]||{};o.pay.push({item:o.items.length===1?o.items[0].name:'',vendor:lq.vendor||'',qty:'',price:'',cur:lq.cur||'KRW'});save();render()}
function reloadPay(id){const o=O(id);o.pay=null;o.payEdited=false;ensurePay(o);save();render()}
function chkAll(){const b=[...document.querySelectorAll('.pchk')];const btn=document.getElementById('okbtn');if(btn)btn.disabled=!(b.length&&b.every(x=>x.checked))}
function allChecked(){const b=[...document.querySelectorAll('.pchk')];return !b.length||b.every(x=>x.checked)}
function payTable(o,opt={}){
 const L=o.pay||[],fx=fxOf(o);
 const th=(t,r)=>`<th${r?' style="text-align:right"':''}>${t}</th>`;
 const head=`<tr>${th('품목')}${th('업체')}${th('수량',1)}${th('단가',1)}${th('금액',1)}${opt.check?'<th style="text-align:center">확인<br><label class="small"><input type="checkbox" style="width:auto" onchange="document.querySelectorAll(\'.pchk\').forEach(b=>b.checked=this.checked);chkAll()"> 전체</label></th>':''}${opt.edit?'<th></th>':''}</tr>`;
 const rows=L.map((l,i)=>opt.edit?`<tr><td><input value="${esc(l.item)}" onchange="editPay(${o.id},${i},'item',this.value)"></td><td><input value="${esc(l.vendor)}" onchange="editPay(${o.id},${i},'vendor',this.value)"></td><td><input style="width:78px;text-align:right" value="${esc(l.qty)}" onchange="editPay(${o.id},${i},'qty',this.value)"></td><td style="white-space:nowrap"><input style="width:96px;text-align:right;display:inline-block" value="${esc(l.price)}" onchange="editPay(${o.id},${i},'price',this.value)"><select style="width:70px;display:inline-block" onchange="editPay(${o.id},${i},'cur',this.value)"><option ${(l.cur||'KRW')==='KRW'?'selected':''}>KRW</option><option ${l.cur==='USD'?'selected':''}>USD</option></select></td><td style="text-align:right">${dual(num(l.qty)*num(l.price),l.cur||'KRW',fx)}</td><td><button class="sm bad" onclick="delPay(${o.id},${i})">×</button></td></tr>`:`<tr><td class="bold">${ut(l.item||'-')}</td><td>${ut(l.vendor)}</td><td style="text-align:right">${won(num(l.qty))}</td><td style="text-align:right">${dual(l.price,l.cur||'KRW',fx)}</td><td style="text-align:right" class="bold">${dual(num(l.qty)*num(l.price),l.cur||'KRW',fx)}</td>${opt.check?'<td style="text-align:center"><input type="checkbox" class="pchk" style="width:24px;height:24px" onchange="chkAll()"></td>':''}</tr>`).join('');
 const empty=!L.length?`<div class="small mut" style="margin-top:6px">${opt.edit?'결제 내역이 비어 있습니다. 줄을 추가하거나 견적에서 가져오세요.':'결제 내역이 없습니다.'}</div>`:'';
 const tools=opt.edit?`<div style="margin-top:6px;display:flex;gap:6px"><button class="sm" onclick="addPay(${o.id})">+ 줄 추가</button><button class="sm" onclick="reloadPay(${o.id})">견적에서 다시 가져오기</button></div>`:'';
 const co=o.company?`${o.company}${FIN[o.company]?' · 재무 확인 '+FIN[o.company]:''}`:'결제 회사 미정';
 return `<div style="overflow:auto"><table>${head}${rows}</table></div>${empty}<div style="text-align:right;margin-top:8px"><span class="small mut">${co} · 환율 1 USD = ${won(fx)} KRW · </span>결제 합계 <span style="font-size:20px;font-weight:700">${fKRW(payTotal(o))}</span> <span class="mut">(≈ ${fUSD(payTotal(o)/fx)})</span></div>${tools}`;
}
function estCell(o,x,k){

function createOrder(){
 let rows=draft.rows.filter(r=>r.name.trim());const raw=(draft.raw||'').trim();
 if(!rows.length&&raw)rows=parseItems(raw);
 if(!rows.length&&!raw){const e=document.createElement('div');e.className='box err';e.textContent='품명이나 메시지를 하나는 입력해 주세요';$('#modalBody').prepend(e);setTimeout(()=>e.remove(),2500);return}
 const items=rows.map(r=>{const x={name:r.name.trim(),qty:String(r.qty||'').replace(/,/g,'').trim(),hint:r.hint||''};const a=String(r.estAmt||'').replace(/,/g,'').trim();if(a){x.estAmt=a;x.estCur=r.estCur||'USD';x.estCond=r.estCond||'이하'}return x});
 const o={id:S.seq,no:'ORD-'+String(S.seq).padStart(3,'0'),raw,at:Date.now(),by:S.me,owners:draft.owners.length?draft.owners:EDITORS.map(u=>u.id),company:draft.company,fx:FX0,fxAt:todayStr(),status:'s1',round:1,lastAt:Date.now(),items:items.length?items:[{name:(raw.split('\n')[0]||'').slice(0,60),qty:'',hint:''}],quotes:[],docs:[],posted:false,final:null,link:null,voidReason:null,log:[]};
 S.seq++;S.orders.unshift(o);
 log(o,S.me==='penny'?'오더 등록 (Penny 직접)':'오더 등록 (Penny 딩톡 메시지 → 대신 등록)',(draft.memo||'').trim());
 notify(o,o.owners,'새 오더: '+o.items.slice(0,2).map(x=>x.name).join(', ')+(o.items.length>2?' 외 '+(o.items.length-2):''));
 closeModal();S.openId=o.id;S.tab='orders';flash('오더가 접수되었습니다. 조사 담당에게 알림이 갔습니다.');
}

let SMP,trBusy=false;const trTried=new Set();
async function getSample(){if(SMP!==undefined)return SMP;try{SMP=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){SMP=null}return SMP}
function pendingTr(o){const L=lang();const out=[];const has=k=>(o.tr||{})[k+'|'+L];const tried=k=>trTried.has(o.id+'|'+L+'|'+k);
 const add=(k,t)=>{if(t&&!has(k)&&!tried(k))out.push({k,text:t})};
 if(o.raw&&rawFrom(o)!==L)add('raw',o.raw);
 o.items.forEach((x,k)=>{const n=x.name||'';if(L==='ko'&&HAS_ZH(n)&&!HAS_KO(n))add('i'+k,n);if(L!=='ko'&&HAS_KO(n))add('i'+k,n)});
 o.log.forEach((l,i)=>{if(l.m&&(l.ml||'ko')!==L)add('l'+i,l.m)});
 o.quotes.forEach((q,i)=>{if(q.memo&&(q.ml||'ko')!==L)add('q'+i,q.memo)});
 return out}
async function autoTranslate(){
 if(!S.autoTr||trBusy||S.tab!=='orders'||!S.openId)return;const o=O(S.openId);if(!o)return;
 const L=lang();const todo=pendingTr(o);if(!todo.length)return;
 todo.forEach(x=>trTried.add(o.id+'|'+L+'|'+x.k));
 const sm=await getSample();if(!sm){S.autoTr=false;save();render();return}
 trBusy=true;
 try{
  const tgt={ko:'Korean',zh:'Simplified Chinese',en:'English'}[L];
  const payload=JSON.stringify(Object.fromEntries(todo.map(x=>[x.k,x.text])));
  const r=await sm(`Translate each value of this JSON object into ${tgt}. These are short business chat messages about purchasing products (prices, quantities, vendors). If a value is already in ${tgt}, keep it unchanged. Keep product names, model codes, numbers and currency symbols as they are. Return ONLY a JSON object with the same keys and the translated strings, with no code fence and no commentary.\n${payload}`,{modelTier:'quick'});
  const mm=(r.text||'').match(/\{[\s\S]*\}/);const res=mm?JSON.parse(mm[0]):{};
  o.tr=o.tr||{};todo.forEach(x=>{if(typeof res[x.k]==='string')o.tr[x.k+'|'+L]=res[x.k]});save();
 }catch(e){if(e&&e.code==='not_granted'){S.autoTr=false;save()}}
 trBusy=false;render();
}

function specText(){return `[오더 기록 프로그램 요구사항]

1. 목적
 - Penny(실무 대표)가 딩톡에 올리는 오더를 건별로 기록한다. 조사·견적 → Penny 가격 확인 → 서류 확인 → 딩톡 결제승인 → 이체 완료까지의 과정과, 중간에 무산된 건도 기록으로 남긴다.
 - 기록용이다. 평소 업무(딩톡 대화, 딩톡 결제승인)를 바꾸지 않고, 입력은 최소로 한다.

2. 오더 등록
 - Penny의 딩톡 메시지를 붙여넣으면 한 건으로 저장된다 (원문 보관).
 - 메시지에서 품목·수량(예: 5,000台)을 자동으로 읽고 사람이 고칠 수 있다. 수량은 참고용이며 매입 확정 수량이 아니다.
 - 한 오더에 품목이 여러 개일 수 있다. Penny 예상가·홍콩 제시가 같은 참고 메모를 품목별로 적을 수 있다.
 - 담당(조사하는 사람, 현재 과장님·석훈·Chloe)을 지정한다.
 - 결제 회사(CH·성신·에잇싱크·부강)는 메시지에 없을 수 있으므로 비워 두고 나중에 지정할 수 있다. 회사에 따라 재무 확인 담당이 정해진다 (CH 지연, 성신 경빈, 에잇싱크 수빈).
 - 오더는 Penny가 지금처럼 딩톡에 올리고, 등록은 조사 담당이 붙여넣어 한다 (Penny의 오더 방식은 바뀌지 않는다).

3. 단계
 ① 조사·견적 → ② Penny 가격 회신 → ③ 서류 준비(견적서·거래명세서) → ④ Penny 서류 확인 → ⑤ 결제승인(딩톡 → 재무팀 → CC 이체) → ⑥ 완료
 - 단계 이동은 버튼 한 번. 견적 입력, 서류 첨부 등은 비어 있어도 넘어갈 수 있다 (현실 그대로 기록).
 - 현실과 다르면 단계를 직접 바꿀 수 있다. 가격 재조율, 서류 수정 시 이전 단계로 돌아갈 수 있다.

4. 무산 기록
 - 어느 단계에서든 '무산'으로 정리할 수 있다. 사유: 가격 안 맞음 / Penny 무응답 / 물량·재고 없음 / 업체 연락 안 됨 / 잘못 등록 / 기타 + 메모
 - 무산된 건도 목록에 남고, 필요하면 다시 진행할 수 있다.
 - 답변 대기 중 3일 이상 변화가 없는 건은 목록에서 표시한다.

5. 견적
 - 업체별로 품목, 단가, 가능 수량, 메모를 여러 건 입력한다 (견적 비교 기록).

 - 결제 내역: 서류 기준으로 품목·업체·수량·단가·금액·합계를 한 표로 확정한다 (견적에서 자동으로 채우고 고칠 수 있다). 결제 회사, 재무 확인 담당, 첨부 서류를 같이 보여 준다.
 - Penny(서류 확인), 재무팀, CC는 같은 표를 본다. 재무팀과 CC는 줄마다 '확인' 칸을 모두 체크해야 확인 완료 버튼이 눌린다.

6. 완료
 - 결제 합계와 이체증(선택)을 기록한다.
 - 완료된 오더에 온라인 주문, 오프라인 입고, 수출 번호를 연결할 수 있다.

7. 기록·안전
 - 모든 단계 변경과 메모에 처리자·시각이 남는다. 지우거나 고칠 수 없고 추가만 된다.
 - 승인 방식 (A) 앱 승인: Penny는 '가격 OK / 다시 조율 / 진행 안 함', '서류 확정 / 수정 필요' 버튼만 누른다. 재무팀(회사별 담당)은 '재무 확인', CC는 '승인·이체 완료'를 누른다. 각자 '내 차례' 목록과 알림으로 자기 대기 건만 본다.
 - 승인 방식 (B) 딩톡 병행: 승인은 딩톡에서 받고 조사 담당이 결과를 대신 기록한다. (A)가 불편하면 (B)로 전환할 수 있어야 한다.
 - 역할: 입력(조사 담당: 과장님·석훈·Chloe) / 가격·서류 승인(Penny) / 재무 확인(회사별: CH 지연, 성신 경빈, 에잇싱크 수빈) / 승인·이체(CC). 단계마다 담당이 달라 한 사람이 겸하지 않는다.

8. 조회
 - 내 차례/진행중/완료/무산/전체 필터, 품목·메시지 검색, 단계별 건수.
 - (추후) 엑셀 내보내기, 이메일 알림

9. 통화·환율
 - 가격(견적, 결제 내역, Penny 예상가)은 USD와 KRW 중 골라 입력하고, 화면에는 항상 달러와 원화를 함께 보여 준다 (예: $50 ≈ ₩73,500).
 - 오더마다 환율(1 USD = N원, 기준일)을 입력·기록하고 변경 이력을 남긴다. 결제 완료 시점의 환율도 기록한다.
 - 대표님의 예상가는 '50달러 이하'처럼 조건(이하/정도/이상)과 함께 입력한다.

10. 언어
 - 화면 언어: 한국 직원은 한국어, Penny는 중국어·영어 선택, CC는 중국어.
 - 메모, 견적 메모, 딩톡 메시지 원문은 작성자 언어 그대로 저장하고, 보는 사람의 언어로 자동 번역해 원문과 함께 보여 준다.
 - 단계명·버튼·안내문은 고정 번역표를 쓴다. (실제 도입 시 번역은 딩톡 번역 기능 또는 번역 서비스 연동이 필요하다)

11. 오더 내리기 (Penny)
 - Penny 화면은 '새 오더 내리기' 큰 버튼 하나로 시작한다. 품명, 수량, 희망가(이하·정도·이상, USD/KRW)만 적는다. 수량과 희망가는 비워도 된다.
 - 이전에 낸 품목은 '자주 낸 품목' 버튼으로 눌러 추가하고, 마지막 수량·희망가가 채워진다. 품명 입력 중에도 이전 품목이 자동 제안된다.
 - 딩톡 메시지를 붙여넣고 '인식해서 채우기'를 눌러도 된다.
 - 낸 뒤에도 Penny가 품목을 수정·삭제·추가할 수 있고, 수정하면 조사 담당에게 알림이 간다.

12. 가격 협의 (여러 번 조율)
 - 조사 담당이 업체 견적을 넣고 'Penny에게 가격 보고'를 누르면, Penny는 품명별 희망가와 견적가, 차이(%)를 한 화면에서 본다.
 - Penny는 세 가지 중 하나를 클릭한다: 가격 OK(진행) / 더 낮게 조율 필요(목표가 선택 입력) / 가격 안 맞음(진행 안 함, 무산 기록).
 - '더 낮게 조율'을 누르면 조율 차수가 올라가고(#2, #3…) 조사 담당 화면 맨 위에 Penny 요청과 목표가가 뜬다. 차수별 견적은 따로 기록되고 이전 차수는 접어서 볼 수 있다. 횟수 제한은 없다.
 - Penny가 가격 OK를 누르면 그때 서류(거래명세서) 단계로 넘어간다.

13. 조사 담당 편의
 - 오더 내용(품명·수량·희망가·현재 최저 견적)이 화면 맨 위에 먼저 보이고, 그 아래에 '지금 할 일'이 나온다.
 - '업체 문의용 복사' 버튼으로 한국어 견적 문의 문구를 복사한다. 기본은 Penny의 희망가를 넣지 않는다(협상에 불리하므로). 필요하면 '희망가 포함'을 체크한다.
 - Penny가 중국어로 쓴 원문과 품명은 한국어로 자동 번역해 같이 보여 준다.
 - 업체 견적은 업체명(이전 입력 업체 자동 제안), 단가, 통화만 넣고 Enter로 추가한다.
 - 목록은 '내 차례' 오더를 맨 위에 초록 테두리로 보여 주고, 각 오더에 지금 해야 할 일을 한 줄로 적는다.`;}

/* ===== 서버(Supabase) 연결: 로그인 · 권한 · 저장 · 새로고침 ===== */
const SB_URL="https://etgcjgeqnzqisxokycfh.supabase.co";
const SB_KEY="sb_publishable_GeVNu4dRdz2fvxnRT8v5aw_0JqLJJyn";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pm-admin-auth'}});
let syncState='wait',pollTimer=null,rerenderWait=false,polling=false,flushing=false,flushAgain=false;
let synced={orders:{},notifs:{}},revs={};
const resetSyncMaps=()=>{synced={orders:{},notifs:{}};revs={}};
const stable=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,c)=>(a[c]=x[c],a),{}):x);
const clone=v=>JSON.parse(JSON.stringify(v));
const nkey=n=>n.t+'-'+n.to+'-'+n.o;
function syncLabel(){return {ok:'서버에 저장됩니다 — 모두 같은 내용을 봅니다',err:'서버에 연결하지 못했습니다. 잠시 후 자동으로 다시 시도합니다'}[syncState]||'연결 중…'}
function softRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='langSel'){rerenderWait=true;return}render()}
document.addEventListener('focusout',()=>{if(rerenderWait)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){rerenderWait=false;render()}},120)});
function showErr(e){const m=(e&&e.message)||'';if(m==='conflict'||/conflict/.test(m)){flash('다른 분이 먼저 수정했습니다. 최신 내용으로 다시 불러왔습니다. 한 번 더 눌러 주세요.','warn');return 'conflict'}flash('저장하지 못했습니다: '+m,'err');return 'err'}
async function pollNow(){
 if(polling||!S.me)return;polling=true;
 try{
  const [a,b]=await Promise.all([sb.rpc('ord_list'),sb.rpc('ord_notif_list')]);
  if(a.error)throw a.error;if(b.error)throw b.error;
  syncState='ok';applyOrders(a.data||[]);applyNotifs(b.data||[]);
  softRender();
 }catch(e){syncState='err'}finally{polling=false}
}
function applyOrders(rows){
 const remote={};rows.forEach(r=>{remote[String(r.id)]=r});
 const local={};S.orders.forEach(o=>{local[String(o.id)]=o});const out=[];
 Object.keys(remote).forEach(k=>{const l=local[k];const sy=synced.orders[k];
  const pending=l&&sy!==undefined&&sy!==stable(l);const fresh=l&&sy===undefined;
  if(pending||fresh){out.push(l);if(revs[k]===undefined)revs[k]=remote[k].rev;return}
  revs[k]=remote[k].rev;synced.orders[k]=stable(remote[k].data);out.push(clone(remote[k].data))});
 Object.keys(local).forEach(k=>{if(remote[k]!==undefined)return;if(synced.orders[k]===undefined)out.push(local[k]);else{delete synced.orders[k];delete revs[k]}});
 out.sort((a,b)=>b.id-a.id);S.orders=out;S.seq=Math.max(1,...out.map(o=>o.id+1));
 if(S.openId&&!S.orders.some(o=>o.id===S.openId))S.openId=null;
}
function applyNotifs(rows){
 const remote={};rows.forEach(r=>{remote[r.key]=r.data});const local={};S.notifs.forEach(n=>{local[nkey(n)]=n});const out=[];
 Object.keys(remote).forEach(k=>{const l=local[k];const sy=synced.notifs[k];const pending=l&&sy!==undefined&&sy!==stable(l);
  if(pending){out.push(l)}else{synced.notifs[k]=stable(remote[k]);out.push(clone(remote[k]))}});
 Object.keys(local).forEach(k=>{if(remote[k]===undefined&&synced.notifs[k]===undefined)out.push(local[k])});
 out.sort((a,b)=>b.t-a.t);S.notifs=out;
}
function syncOut(){if(!S.me)return;if(flushing){flushAgain=true;return}clearTimeout(syncOut.t);syncOut.t=setTimeout(syncFlush,300)}
async function syncFlush(){
 if(flushing||!S.me)return;flushing=true;flushAgain=false;let changed=false;
 try{
  for(const o of S.orders.slice()){const k=String(o.id);const str=stable(o);if(synced.orders[k]===str)continue;
   const body=clone(o);
   try{
    const {data,error}=await sb.rpc('ord_save',{p_order:body,p_base_rev:revs[k]||0});
    if(error)throw error;
    changed=true;
    if(data.id!==body.id){delete synced.orders[k];delete revs[k];o.id=data.id;o.no=data.no;if(S.openId===body.id)S.openId=data.id;const nk=String(o.id);revs[nk]=data.rev;synced.orders[nk]=stable(o)}
    else{revs[k]=data.rev;synced.orders[k]=str}
   }catch(e){
    const r=showErr(e);
    if(r==='conflict'){S.orders=S.orders.filter(x=>x!==o);delete synced.orders[k];delete revs[k]}
    else synced.orders[k]=undefined;
    syncState=r==='conflict'?syncState:'err';
   }
  }
  for(const n of S.notifs.slice()){const k=nkey(n);const str=stable(n);if(synced.notifs[k]===str)continue;
   try{const {error}=await sb.rpc('ord_notif_put',{p_key:k,p_to:n.to,p_data:clone(n)});if(error)throw error;synced.notifs[k]=str;
    if(n.to!==S.me){S.notifs=S.notifs.filter(x=>x!==n);delete synced.notifs[k]}}
   catch(e){synced.notifs[k]=str}}
 }finally{flushing=false}
 if(flushAgain)syncOut();
 await pollNow();
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==='visible'&&!flushing)pollNow()},7000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me)pollNow()});
