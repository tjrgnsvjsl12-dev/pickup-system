  --success:#3f7a4e; --success-fg:#fff; --chip:#efe6da;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --surface:#262320; --surface-2:#2d2a25; --fg:#eee8df; --muted:#a69b8c;
    --border:#3a362f; --accent:#d97a4e; --accent-fg:#1c1a17; --danger:#e06060; --danger-fg:#1c1a17;
    --success:#6cc789; --success-fg:#1c1a17; --chip:#33302a; color-scheme:dark;

}

  --bg:#1c1a17; --surface:#262320; --surface-2:#2d2a25; --fg:#eee8df; --muted:#a69b8c;
  --border:#3a362f; --accent:#d97a4e; --accent-fg:#1c1a17; --danger:#e06060; --danger-fg:#1c1a17;
  --success:#6cc789; --success-fg:#1c1a17; --chip:#33302a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Noto Sans SC',-apple-system,sans-serif;padding:16px;padding-block:24px;max-width:640px;margin:0 auto;}

label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg);font-size:14px;font-family:inherit;margin-bottom:12px}

.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}

const SB_URL = "https://etgcjgeqnzqisxokycfh.supabase.co";
const SB_KEY = "sb_publishable_GeVNu4dRdz2fvxnRT8v5aw_0JqLJJyn";
const IS_ALBA_LINK = /^[A-Z0-9]{5,8}$/i.test((location.hash || '').replace('#','').trim());
// 관리자 화면은 로그인을 유지(새로고침해도 로그아웃 안 됨). 알바 링크 화면은 예전처럼 로그인 정보를 저장하지 않음.

// ---------- helpers ----------
function h(tag, attrs, children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'text') el.textContent = attrs[k];
    else if(k === 'html') el.innerHTML = attrs[k];
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) el.appendChild(c); });
  return el;
}
async function copyText(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    flashBtn(btn, '복사됨!');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      flashBtn(btn, '복사됨!');
    }catch(e2){ flashBtn(btn, '복사 실패'); }
  }
}
function flashBtn(btn, msg){
  if(!btn) return;
  const old = btn.textContent;
  btn.textContent = msg;
  setTimeout(()=>{ btn.textContent = old; }, 1200);
}
function fmtDate(iso, zh){
  try{ const d = new Date(iso); return d.toLocaleString(zh ? 'zh-CN' : 'ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function fmtShortDate(iso){
  try{ const d = new Date(iso+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
  catch(e){ return iso; }
}
function fmtWon(n){
  if(n === null || n === undefined || n === '') return '';
  const num = Number(n);
  if(isNaN(num)) return '';
  return num.toLocaleString('ko-KR');
}
function buildCopyText(list, groupBy){
  // 같은 날짜는 한 번만, 같은 매장도 한 번만 표시하고 아래에 모델 · 용량 · 색상 x수량만 나열
  const sorted = [...list].sort((a,b)=>
    (a.purchase_date||'').localeCompare(b.purchase_date||'') ||
    (a.store_name||'').localeCompare(b.store_name||'') ||
    (a.created_at||'').localeCompare(b.created_at||'')
  );
  const cardOf = p => [p.card_company, p.card_last4].filter(Boolean).join(' ');
  const itemOf = (p, withCard) => {
    const spec = [p.model, p.capacity, p.color].filter(Boolean).join(' · ') || '-';
    return `${spec} x${p.qty}` + (withCard && cardOf(p) ? ` (${cardOf(p)})` : '');
  };
  // 한 매장 묶음: 카드가 하나뿐이면 매장 이름 옆에 한 번만, 여러 개면 줄마다 표시
  const block = (storeName, rows) => {
    const cards = [...new Set(rows.map(cardOf).filter(Boolean))];
    const single = cards.length === 1;
    const out = [];
    if(storeName !== null) out.push(`[${storeName}]` + (single ? ` ${cards[0]}` : ''));
    else if(single) out.push(cards[0]);
    rows.forEach(p=>out.push(itemOf(p, !single)));
    return out;
  };
  const by = (arr, keyFn) => { const m = new Map(); arr.forEach(x=>{ const k = keyFn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
  const lines = [];
  if(groupBy==='day'){
    by(sorted, p=>fmtShortDate(p.purchase_date)).forEach((dayRows, day)=>{
      lines.push(`■ ${day}`);
      by(dayRows, p=>p.store_name||'-').forEach((rows, store)=>{ lines.push(...block(store, rows)); });
      lines.push('');
    });
  } else {
    by(sorted, p=>p.store_name||'-').forEach((storeRows, store)=>{
      lines.push(`■ ${store}`);
      by(storeRows, p=>fmtShortDate(p.purchase_date)).forEach((rows, day)=>{
        lines.push(day);
        lines.push(...block(null, rows));
      });
      lines.push('');
    });
  }
  return lines.join('\n').trim();
}

// 전체현황용: 기록 목록 + 모델별 합계 + 총수량까지 한 번에 복사할 수 있는 텍스트
function buildDayReportText(list, labels){
  const body = buildCopyText(list, 'day');
  // 화면의 '모델별 합계' 카드와 같은 형태: 모델 용량 색상 + 대수, 마지막에 총계
  const by = {};
  list.forEach(p=>{
    const k = [p.model, p.capacity, p.color].filter(Boolean).join(' ') || '-';
    by[k] = (by[k]||0) + p.qty;
  });
  const total = Object.values(by).reduce((a,b)=>a+b,0);
  const out = [body, '', `▣ ${labels.modelTotal}`];
  Object.keys(by).forEach(k=>out.push(`${k}  ${by[k]}${labels.unit}`));
  out.push(`${labels.grandTotal}  ${total}${labels.unit}`);
  return out.join('\n').trim();
}

function selectOf(options, placeholder){
  const sel = h('select',{});
  if(placeholder) sel.appendChild(h('option',{value:'',text:placeholder}));
  options.forEach(o=>sel.appendChild(h('option',{value:o,text:o})));
  return sel;
}

function chipGroup(options, initial, onChange){
  let value = initial || '';
  const wrap = h('div',{class:'chiprow'});
  let buttons = [];
  function build(opts){
    wrap.innerHTML = '';
    buttons = opts.map(opt=>{
      const b = h('button',{type:'button', class:'chip-btn'+(opt===value?' selected':''), text:opt});
      b.onclick = ()=>{
        value = opt;
        buttons.forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        if(onChange) onChange(value);
      };
      wrap.appendChild(b);
      return b;
    });
  }
  build(options);
  return {
    el: wrap,
    get value(){ return value; },
    set value(v){ value=v; buttons.forEach(b=>b.classList.toggle('selected', b.textContent===v)); },
    setOptions(opts, keepIfPresent){
      if(!(keepIfPresent && opts.includes(value))) value = '';
      build(opts);
    }
  };
}

    doneCard.appendChild(reportBox);

    doneCard.appendChild(reportCopyBtn);
    doneCard.appendChild(h('div',{class:'muted',style:'margin:6px 0 0',text:t.fillTimesHint}));

    function buildReportText(){
      const totalQty = items.reduce((a,i)=>a+i.qty,0);
      const orderCount = (session.order_numbers||[]).length;
      const alipay = alipayInput.value.trim();
      const name = nameInput2.value.trim();
      const arrive = arriveInput.value || '';
      const complete = completeInput.value || '';
      return `${alipay || '-'},${name || '-'}\n${arrive || '-'}픽업시작 ${orderCount}건 ${totalQty}대 수령 ${complete || '-'}퇴근`;
    }
    function refreshReport(){ reportBox.textContent = buildReportText(); }
    [arriveInput, completeInput, alipayInput, nameInput2].forEach(inp=>inp.addEventListener('input', refreshReport));
    refreshReport();

    const confirmBox = h('div',{class:'hidden'});
    const finishErr = h('div',{class:'err hidden'});
    doneCard.appendChild(finishErr);

    const finishBtn = h('button',{class:'btn-primary',text:t.finish,style:'margin-top:10px'});

      };
      const noBtn = h('button',{class:'btn-ghost',text:t.cancel, onclick:()=>{ confirmBox.className='hidden'; }});
      row.appendChild(yesBtn); row.appendChild(noBtn);
      confirmBox.appendChild(row);
    };
    doneCard.appendChild(finishBtn);
    doneCard.appendChild(confirmBox);
    app.appendChild(doneCard);
  }

  load();
}

// 엑셀에서 복사한 것과 같은 형태(표 HTML + 탭 구분 텍스트, 줄바꿈 CRLF)로 클립보드에 넣는다. 딩톡 표 붙여넣기용.
async function copyAsExcel(grid){
  const esc = v=> String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const plain = grid.map(r=>r.map(v=>String(v==null?'':v)).join('\t')).join('\r\n')+'\r\n';
  const html = '<table>'+grid.map(r=>'<tr>'+r.map(v=>'<td style="mso-number-format:\'\\@\'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>';
  if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    await navigator.clipboard.write([ new ClipboardItem({ 'text/plain': new Blob([plain],{type:'text/plain'}), 'text/html': new Blob([html],{type:'text/html'}) }) ]);
  } else await navigator.clipboard.writeText(plain);
  return plain;
}

  };
  function t(key, vars){
    let s = (AT[lang] && AT[lang][key] != null) ? AT[lang][key] : (AT.ko[key]||key);
    if(vars) Object.keys(vars).forEach(k=>{ s = s.replace('{'+k+'}', vars[k]); });
    return s;
  }
  function setLang(l){
    lang = l;
    try{ localStorage.setItem('pm_admin_lang', l); }catch(e){}
    if(session) drawDashboard(); else drawLogin();
  }
  function langSwitcher(){
    return h('div',{class:'langsw'},[
      h('button',{class:'btn-ghost'+(lang==='ko'?' btn-primary':''), text:'한국어', onclick:()=>setLang('ko')}),
      h('button',{class:'btn-ghost'+(lang==='zh'?' btn-primary':''), text:'中文', onclick:()=>setLang('zh')})
    ]);
  }

  // 로그인 유지 시간: 마지막 사용 후 12시간이 지나면 자동 로그아웃 (공용 PC 보호)
  const IDLE_LIMIT_MS = 12*60*60*1000;
  function touchActive(){ try{ localStorage.setItem('pm_last_active', String(Date.now())); }catch(e){} }
  let lastTouch = 0;
  ['click','keydown','pointerdown'].forEach(ev=> document.addEventListener(ev, ()=>{ const n = Date.now(); if(n-lastTouch>60000){ lastTouch = n; touchActive(); } }, true));
  async function boot(){
    try{ const la = Number(localStorage.getItem('pm_last_active')||0); if(la && Date.now()-la > IDLE_LIMIT_MS) await sb.auth.signOut(); }catch(e){}
    touchActive();
    const { data } = await sb.auth.getSession();
    session = data.session;
    if(session) await afterLogin(); else drawLogin();
  }

  function drawLogin(){
    app.innerHTML = '';
    app.appendChild(h('div',{class:'topbar'},[
      h('div',{},[h('h1',{text:t('brand')}), h('div',{class:'sub',text:t('adminLogin')})]),
      langSwitcher()
    ]));
    const card = h('div',{class:'card'});
    const email = h('input',{type:'email',placeholder:t('email')});
    const pw = h('input',{type:'password',placeholder:t('password')});
    const err = h('div',{class:'err hidden'});
    card.appendChild(h('label',{text:t('email')})); card.appendChild(email);
    card.appendChild(h('label',{text:t('password')})); card.appendChild(pw);
    card.appendChild(err);
    const btn = h('button',{class:'btn-primary',text:t('login')});
    btn.onclick = async ()=>{
      err.className='err hidden'; btn.disabled=true; btn.textContent=t('loggingIn');
      const { data, error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
      btn.disabled=false; btn.textContent=t('login');
      if(error){ err.textContent = t('loginFail',{msg:error.message}); err.className='err'; return; }
      session = data.session;
      await afterLogin();
    };
    pw.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });
    card.appendChild(btn);
    app.appendChild(card);
  }

  async function afterLogin(){
    const [{ data: storeData, error: storeErr }, { data: profData, error: profErr }, { data: settingsData, error: settingsErr }, { data: onlineData }] = await Promise.all([
      sb.rpc('list_stores'), sb.rpc('get_my_profile'), sb.rpc('get_app_settings'), sb.rpc('online_me')
    ]);
    onlineMe = onlineData || null;
    if(!storeErr) stores = storeData || [];
    storeZh = {}; stores.forEach(s=>{ if(s.name_zh) storeZh[s.name] = s.name_zh; });
    if(!profErr) myProfile = profData;
    if(!settingsErr && settingsData) appSettings = settingsData;
    drawDashboard();
  }

  function drawDashboard(){
    if(progressTimer){ clearInterval(progressTimer); progressTimer = null; }
    document.body.style.maxWidth = ''; window.onbeforeunload = null;
    app.innerHTML = '';
    const top = h('div',{class:'topbar'},[
      h('div',{},[h('h1',{text:t('brand')}), h('div',{class:'sub',text:(myProfile&&myProfile.display_name)||session.user.email})]),
      h('div',{style:'display:flex;align-items:center;gap:8px'},[
        langSwitcher(),
        h('button',{class:'btn-ghost btn-sm',text:t('logout'),onclick: async ()=>{ await sb.auth.signOut(); session=null; drawLogin(); }})
      ])
    ]);
    app.appendChild(top);

    const isPart = !!(myProfile && myProfile.role === 'part'); // 시간제 알바 계정: 구매 기록만 사용
    const hasOnline = !!(onlineMe && (onlineMe.perms||[]).length);
    if(isPart && section!=='online') section = 'purchase';
    if(section==='online' && !hasOnline) section = isPart ? 'purchase' : 'alba';
    const sectionRow = h('div',{class:'tabs',style:'margin-bottom:6px'});
    [['alba',t('sectionAlba')],['purchase',t('sectionPurchase')],['supplier',t('sectionSupplier')],['online','온라인 주문'],['backup',t('sectionBackup')]].filter(([key])=>key==='online' ? hasOnline : (!isPart||key==='purchase')).forEach(([key,label])=>{
      const tb = h('div',{class:'tab'+(section===key?' active':''), text:label, onclick:()=>{ section=key; drawDashboard(); }});
      sectionRow.appendChild(tb);
    });
    app.appendChild(sectionRow);

    if(section==='alba') drawAlbaSection();
    else if(section==='purchase') drawPurchaseSection();
    else if(section==='supplier') drawSupplierSection();
    else if(section==='online') drawOnlineSection();
    else drawBackupSection();
  }

  // ================= 온라인 주문 (수령 · 집계 · 내보내기) =================
  const onlineHas = p => !!(onlineMe && (onlineMe.perms||[]).includes(p));
  const onlineEsc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const onlineTime = v => { if(!v) return ''; const p = {}; new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(v)).forEach(x=>p[x.type]=x.value); return p.month+'/'+p.day+' '+p.hour.replace('24','00')+':'+p.minute; };
  const nf = n => Number(n||0).toLocaleString('ko-KR');
  // 운송장 조회 주소: 저장된 추적 링크 > 택배사별 주소 > 네이버 검색(택배사 자동 인식)
  const trackUrl = r => {
    const n = String(r.tracking||'').trim(); if(!n) return '';
    if(/^https?:\/\//i.test(r.track_link||'')) return r.track_link;
    if(/CJ|대한통운/i.test(r.carrier||'')) return 'https://www.cjlogistics.com/ko/tool/parcel/newTracking?gnbInvcNo='+encodeURIComponent(n);
    return 'https://search.naver.com/search.naver?query='+encodeURIComponent('운송장 '+n);
  };
  const srcLabel = v => v==='딩톡 이관' ? '딩톡 가져옴' : v;
  const itemName = raw => { const m = onlineModelParts(raw); return [m.model,m.cap,m.color].filter(Boolean).join(' ') || String(raw||'(모델 없음)'); };
  const stageLabel = v => v==='송장 대기' ? '배송 전' : v;

  function onlineModelParts(raw){
    raw = String(raw||'');
    const cap = (raw.match(/(\d+)\s*(tb|gb)/i)||[])[0]||'';
    const m = raw.match(/^\s*iphone\s*(\d+|duo|fold|flip|se)\s*(pro\s*max|promax|pro|plus|air|mini)?/i);
    const model = m ? ('iPhone '+(/^\d+$/.test(m[1])?m[1]:m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase())+(m[2]?(' '+m[2].replace(/promax/i,'Pro Max').replace(/^pro\s*max$/i,'Pro Max').replace(/^pro$/i,'Pro').replace(/^plus$/i,'Plus').replace(/^air$/i,'Air').replace(/^mini$/i,'Mini')):'')) : raw;
    const color = (raw.replace(/^\s*iphone\s*(\d+|duo|fold|flip|se)\s*(pro\s*max|promax|pro|plus|air|mini)?/i,'').replace(/(\d+)\s*(tb|gb)/i,'').replace(/\b(kr|spec|jp|us|hk|cn)\b/ig,'').trim());
    return { model, cap: cap.toUpperCase().replace(/\s/g,''), color: color.replace(/\b\w/g,c=>c.toUpperCase()), raw };
  }

    // 애플 배송 예정 기간 문자열 → {from,to} (YYYY-MM-DD). 예: "11월 25 - 11월 27", "11/25~11/27", "2026-11-25 ~ 2026-11-27", "Nov 25 - Nov 27"
    const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    function parseWindow(v){
      const t = String(v==null?'':v).trim(); if(!t) return null;
      const now = new Date(Date.now()+9*3600*1000); const cy = now.getUTCFullYear(), cm = now.getUTCMonth()+1;
      const found = [];
      const re = /(?:(\d{4})\s*[-./년年]\s*)?(\d{1,2})\s*[-./월月]\s*(\d{1,2})\s*(?:일|日)?|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s*(\d{1,2})/gi;
      let m;
      while((m = re.exec(t))){
        const y = m[1]?Number(m[1]):null, mo = m[2]?Number(m[2]):MON[m[4].toLowerCase()], d = Number(m[3]||m[5]);
        if(mo>=1&&mo<=12&&d>=1&&d<=31) found.push({y,mo,d,end:re.lastIndex});
      }
      if(!found.length) return null;
      if(found.length===1){ // "11월 25일 - 27일" 처럼 뒤쪽에 일만 있는 경우
        const m2 = /^\s*[-~–—]\s*(\d{1,2})\s*(?:일|日)?\s*$/.exec(t.slice(found[0].end));
        if(m2) found.push({y:found[0].y,mo:found[0].mo,d:Number(m2[1])});
      }
      const yr = (f)=> f.y || (f.mo < cm-6 ? cy+1 : f.mo > cm+6 ? cy-1 : cy);
      const iso = (y,mo,d)=> y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const a = found[0], b = found[found.length-1];
      const ya = yr(a); let yb = b.y || ya; if(!b.y && (b.mo<a.mo)) yb = ya+1;
      return { from: iso(ya,a.mo,a.d), to: iso(yb,b.mo,b.d) };
    }

  async function loadOnlineAll(company){
    const all = [];
    for(let off=0; off<200000; off+=1000){
      const { data, error } = await sb.rpc('online_list', { p_company: company||null, p_limit: 1000, p_offset: off });
      if(error) throw error;

  function onlineStats(rows){
    const st = {};
    rows.forEach(r=>{
      const c = st[r.company] = st[r.company] || { total:0, done:0, wait:0, nt:0, tu:0, du:0, wu:0, nu:0 };
      c.total++; c.tu += r.qty||0;
      if(r.stage==='배송완료'){ c.done++; c.du += r.qty||0; }
      else if(r.stage==='배송중'){ c.wait++; c.wu += r.qty||0; }
      else { c.nt++; c.nu += r.qty||0; }
    });
    return st;
  }
  function statsFromSummary(rows){
    const st = {};
    rows.forEach(r=>{
      const c = st[r.company] = st[r.company] || { total:0, done:0, wait:0, nt:0, tu:0, du:0, wu:0, nu:0 };
      const n = Number(r.orders), u = Number(r.units);
      c.total += n; c.tu += u;
      if(r.stage==='배송완료'){ c.done += n; c.du += u; }
      else if(r.stage==='배송중'){ c.wait += n; c.wu += u; }
      else { c.nt += n; c.nu += u; }
    });
    return st;
  }

      const cell = (u,n,cls)=> h('td',{class:cls||''},[h('div',{class:'n'+(u?'':' z'),text:nf(u)+'대'})]);
      stCompanies.forEach(c=>{ const s=st[c];
        b2.appendChild(h('tr',{},[h('td',{class:'co',text:c}), cell(s.tu,s.total,'b'), cell(s.nu,s.nt), cell(s.wu,s.wait), cell(s.du,s.done,'g'), h('td',{},[h('div',{class:'n',text:pct(s.du,s.tu)+'%'})])]));
      });
      const f2 = h('tfoot'); f2.appendChild(h('tr',{},[h('td',{class:'co',text:'합계'}), cell(agg.tu,agg.total,'b'), cell(agg.nu,agg.nt), cell(agg.wu,agg.wait), cell(agg.du,agg.done,'g'), h('td',{},[h('div',{class:'n',text:pct(agg.du,agg.tu)+'%'})])]));

    if(st['미분류']) body.appendChild(h('div',{class:'err',text:'⚠ 회사가 지정되지 않은 주문이 있습니다. 카드 등록이 필요합니다.'}));

    // ⑤ 아직 안 온 주문 목록 (서버에서 검색·페이지 처리, 50건씩)
    const lc = h('div',{class:'card'});
    const scope = (onlineMonth?ymLabel(onlineMonth)+' 주문 중 ':'')+(onlineDay?onlineDay.slice(5).replace('-','/')+' 주문 중 ':'');
    const modeTitle = scope+(onlineAlertKind==='arr'?'배송중인데 예정일이 지난 주문':onlineAlertKind==='ship'?'배송 전인데 예정일이 지난 주문':onlineStage==='송장 대기'?'① 배송 전 주문':onlineStage==='배송중'?'② 배송중 주문':'아직 안 온 주문 (① 배송 전 + ② 배송중)');
    lc.appendChild(h('div',{style:'font-weight:800;margin-bottom:8px',text:modeTitle}));
    if(onlineDay) lc.appendChild(h('button',{class:'btn-ghost btn-sm',style:'margin-bottom:8px',text:'날짜 선택 해제 ✕',onclick:()=>{ onlineDay=''; drawDashboard(); }}));
    const q = h('input',{type:'search',placeholder:'주문번호 / 운송장번호 검색'});
    lc.appendChild(q);
    const cnt = h('div',{class:'muted',style:'margin:8px 0 6px'}); lc.appendChild(cnt);
    const wrap = h('div',{class:'ptwrap'});
    const pt = h('table',{class:'ptable'});
    const alertMode = !!onlineAlertKind;
    pt.appendChild(h('thead',{html:'<tr><th>주문번호</th><th>회사</th><th>배송지</th><th>도착 예정</th><th>운송장번호</th><th>'+(alertMode?'지연':'상태')+'</th></tr>'}));
    const list = h('tbody'); pt.appendChild(list); wrap.appendChild(pt); lc.appendChild(wrap);
    const more = h('button',{class:'btn-ghost',style:'width:100%;margin-top:8px',text:'더 보기 (50건씩)'});
    lc.appendChild(more);
    body.appendChild(lc);
    let offset = 0, seq = 0, total = 0;
    async function load(reset){
      if(reset){ offset = 0; list.innerHTML=''; }
      const my = ++seq;
      const { data, error } = alertMode
        ? await sb.rpc('online_overdue', { p_company: onlineCompany||null, p_kind: onlineAlertKind, p_q: q.value.trim()||null, p_limit: 50, p_offset: offset, p_ym: onlineMonth||null })
        : await sb.rpc('online_pending', { p_company: onlineCompany||null, p_q: q.value.trim()||null, p_limit: 50, p_offset: offset, p_stage: onlineStage||null, p_ym: onlineMonth||null, p_day: onlineDay||null });
      if(my!==seq) return;
      if(error){ list.innerHTML=''; cnt.textContent = error.message; cnt.className='err'; more.classList.add('hidden'); return; }
      const rows = data||[];
      if(rows.length) total = Number(rows[0].total); else if(reset) total = 0;
      rows.forEach(r=>{
        const late = r.days_late!=null ? (r.days_late+'일 경과') : '';
        const last = alertMode ? h('td',{class:'late',text:late}) : h('td',{},[h('span',{class:'statusbadge '+(r.stage==='배송중'?'in_progress':'before'),text:stageLabel(r.stage)})]);
        list.appendChild(h('tr',{},[
          h('td',{class:'mono',text:r.order_no}), h('td',{text:r.company||''}), h('td',{text:r.ship_to||''}), h('td',{text:r.window_text||''}),
          (r.tracking ? h('td',{class:'mono'},[h('a',{class:'trklink',href:trackUrl(r),target:'_blank',rel:'noopener noreferrer',title:'배송 조회 (새 창)',text:r.tracking+' ↗'})]) : h('td',{class:'mono none',text:'운송장 없음'})), last
        ]));
      });
      offset += rows.length;
      cnt.className='muted'; cnt.textContent = total ? ('총 '+nf(total)+'건 중 '+nf(offset)+'건 표시') : '';
      more.classList.toggle('hidden', offset>=total);
      if(reset && !rows.length){ list.appendChild(h('tr',{},[h('td',{colspan:'6',class:'muted',style:'text-align:center;padding:18px',text:alertMode||onlineStage||onlineMonth||onlineDay||q.value.trim()?'해당하는 주문이 없습니다 ✓':t('none')})])); }
    }
    more.onclick = ()=>load(false);
    let tm = null; q.addEventListener('input',()=>{ clearTimeout(tm); tm = setTimeout(()=>load(true), 300); });
    load(true);
  }

  // 업로드한 파일 종류 판별 (엉뚱한 탭에 올리는 실수 방지)
  const sniffKind = (X, wb)=>{
    const name = wb.SheetNames.join(' ');
    const aoa = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
    const head = aoa.slice(0,3).map(r=>r.join(' ')).join(' ');
    if(/提货单|delivery|pickup/i.test(name) || /录入批次|子表单/.test(head)) return 'delivery';
    if(/总单/.test(name) || (/订单码/.test(head) && /型号/.test(head) && /银行卡|卡号/.test(head))) return 'order';
    if(/订单状态/.test(head) && /下单日/.test(head) && /订单号/.test(head)) return 'status';
    if(/链接|link|追踪|추적/i.test(head) && /订单码|주문/.test(head)) return 'tracking';
    return '';
  };
  const wrongTab = (msg, tab, label)=> Object.assign(new Error(msg), {goTab:tab, goLabel:label});
  const WRONG = {
    delivery: ['이 파일은 "배송 온 건"(딩톡 수령 내역)입니다. 도착한 건은 [딩톡 가져오기]에 올려 주세요.','ding','딩톡 가져오기로 이동'],
    tracking: ['이 파일은 운송장 파일입니다 (배송중 등록용). 도착 확인이 아니므로 [운송장 등록]에 올려 주세요.','track','운송장 등록으로 이동'],
    order: ['이 파일은 주문 파일입니다. [주문 등록]에 올려 주세요.','orders','주문 등록으로 이동'],
    status: ['이 파일은 "주문 추적 표"입니다. 주문은 [주문 등록]에 올리고, 운송장번호가 들어 있는 건은 [운송장 등록]에 올려 주세요.','orders','주문 등록으로 이동']
  };

    const box = (on, title, desc, state, btns)=>{

      if(btns && btns.length){ const r = h('div',{class:'fgb'}); btns.forEach(([k,l])=>{ if(onlineHas(k==='ding'||k==='track'||k==='orders'?'admin':'receive')) r.appendChild(h('button',{type:'button',class:'btn-ghost btn-sm'+(cur===k?' selected':''),text:l,onclick:go(k)})); }); b.appendChild(r); }
      return b;

      box(cur==='track','② 운송장 등록','택배 운송장번호가 나온 건을 올립니다 (아직 도착한 건 아님)','→ 배송중',[['track','운송장 등록']]),
      box(cur==='recv'||cur==='ding','③ 도착 확인','박스가 실제로 도착한 것을 입력합니다. 현장에서 스캔하거나 딩톡 수령 내역을 가져옵니다','→ 배송완료',[['recv','수령 (스캔)'],['ding','딩톡 가져오기']])
    );
    wrap.appendChild(grid); return wrap;
  }


  // ---- 주문 직접 입력 / 붙여넣기 (주문 등록 화면 아래) ----
  function drawManualOrders(body){
    const card = h('div',{class:'card'});
    card.appendChild(h('div',{style:'font-weight:700;font-size:16px;margin-bottom:4px',text:'주문 직접 입력 (한 건씩 / 붙여넣기)'}));
    card.appendChild(h('div',{class:'muted',style:'margin-bottom:10px',text:'파일 없이 주문을 넣는 방법입니다. 낱개로 주문한 건은 아래 칸에 한 건씩 입력하고, 딩톡·엑셀에 있는 여러 줄은 복사해서 붙여넣으세요. 이미 등록된 주문번호는 건너뜁니다.'}));
    let company = '', ship = ''; try{ ship = localStorage.getItem('pm_online_office') || ''; }catch(e){}
    let qty = 2;
    const today = new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
    const chipRow = (label, opts, get, set)=>{
      const wrap = h('div',{style:'margin-bottom:8px'}); wrap.appendChild(h('label',{text:label}));
      const row = h('div',{class:'chiprow'}); const bs = {};
      opts.forEach(([v,t])=>{ const b = h('button',{type:'button',class:'chip-btn'+(get()===v?' selected':''),text:t,onclick:()=>{ set(v); Object.keys(bs).forEach(k=>bs[k].classList.toggle('selected',k===String(v))); }}); bs[v]=b; row.appendChild(b); });
      wrap.appendChild(row); return wrap;
    };
    card.appendChild(chipRow('회사 (꼭 선택)', [['CH','CH'],['부강','부강']], ()=>company, v=>{ company=v; }));
    card.appendChild(chipRow('배송지(받는 사무실)', [['서울','서울'],['부산','부산']], ()=>ship, v=>{ ship=v; }));
    const tabs = h('div',{class:'chiprow',style:'margin:6px 0 10px'}); let mode = 'one';
    const one = h('div',{}), paste = h('div',{class:'hidden'});
    const tb1 = h('button',{type:'button',class:'chip-btn selected',text:'한 건 입력',onclick:()=>{ mode='one'; tb1.classList.add('selected'); tb2.classList.remove('selected'); one.classList.remove('hidden'); paste.classList.add('hidden'); }});
    const tb2 = h('button',{type:'button',class:'chip-btn',text:'여러 줄 붙여넣기',onclick:()=>{ mode='paste'; tb2.classList.add('selected'); tb1.classList.remove('selected'); paste.classList.remove('hidden'); one.classList.add('hidden'); }});
    tabs.append(tb1, tb2); card.appendChild(tabs);
    // 한 건 입력
    const fNo = h('input',{type:'text',placeholder:'W1234567890',autocomplete:'off'});
    const fModel = h('input',{type:'text',placeholder:'딩톡/엑셀의 모델명 그대로 (예: iphone18promax 1TB burgundy kr spec)',autocomplete:'off'});
    const fDate = h('input',{type:'date',value:today});
    const fWin = h('input',{type:'text',placeholder:'예: 11월 25 - 11월 27 (모르면 비워 두세요)',autocomplete:'off'});
    one.append(h('label',{text:'주문코드 (W로 시작)'}), fNo, h('label',{text:'모델명'}), fModel);
    one.appendChild(chipRow('수량', [[2,'2대'],[1,'1대']], ()=>qty, v=>{ qty=v; }));
    one.append(h('label',{text:'주문일'}), fDate, h('label',{text:'배송 예정 기간 (선택)'}), fWin);
    // 붙여넣기
    const ta = h('textarea',{placeholder:'딩톡 온라인 구매 표와 같은 순서(모델명 · 수량 · 매장 · 주문코드 · … · 주문일 · 수령시간)로 복사한 줄을 붙여넣으세요. 한 줄에 주문 한 건입니다.',style:'min-height:110px'});
    paste.append(ta, h('div',{class:'muted',text:'모델명, 수량, 주문코드(W…), 주문일, 예정 기간은 줄 안에서 자동으로 찾습니다. 회사와 배송지는 위에서 고른 값이 적용됩니다(줄에 서울/부산이 있으면 그 값이 우선).'}));
    card.append(one, paste);
    const err = h('div',{class:'err hidden'}); const prev = h('button',{class:'btn-primary',text:'미리보기'});
    card.append(err, prev); body.appendChild(card);
    const out = h('div',{class:'card hidden'}); body.appendChild(out);

    const rowOf = (o)=>{ const w = o.window_text ? parseWindow(o.window_text) : null;
      return { order_no:o.order_no, model_raw:o.model_raw||'', qty:o.qty||2, order_date:o.order_date||'', ship_to:o.ship_to||ship||'', company, window_text:o.window_text||'', window_from:w?w.from:'', window_to:w?w.to:'' }; };
    function parsePaste(txt){
      const rows = [];
      txt.split(/\r?\n/).forEach(line=>{
        if(!line.trim()) return;
        const cells = line.split('\t').map(x=>x.trim());
        const cs = cells.length>1 ? cells : line.split(/\s{2,}|\s*,\s*/).map(x=>x.trim());
        const no = cs.find(c=>/^W\d{6,}$/i.test(c)); if(!no) return;
        const model = cs.find(c=>/iphone|아이폰|ipad|macbook|watch|airpods|\d\s?(tb|gb)/i.test(c)) || cs.find(c=>c && c!==no && !/^\d{1,3}$/.test(c) && !/^\d{4}[-/.]/.test(c)) || '';
        const q = cs.find(c=>/^\d{1,2}$/.test(c));
        const sh = cs.find(c=>/서울|seoul|부산|busan/i.test(c));
        const dm = cs.map(c=>c.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)).find(Boolean);
        const wcell = cs.find(c=>/[-~–]/.test(c) && !/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(c) && parseWindow(c) && /월|\//.test(c));
        rows.push({ order_no:no.toUpperCase(), model_raw:model, qty:q?Number(q):2, order_date:dm?dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0'):'', ship_to: sh?(/서울|seoul/i.test(sh)?'서울':'부산'):'', window_text:wcell||'' });
      });
      return rows;
    }
    const LABEL = {new:['ok','신규 등록'], complete:['ok','딩톡에서 먼저 가져온 건 → 주문 정보 보완'], exists:['muted','이미 등록됨 (건너뜀)'], dup_in_file:['err','입력 안에서 중복 (건너뜀)'], bad_row:['err','주문코드 형식 오류 (건너뜀)'], unknown_card:['err','회사 미지정 (건너뜀)']};
    prev.onclick = async ()=>{
      err.className='err hidden'; out.className='card hidden'; out.innerHTML=''; prev.disabled = true;
      try{
        if(!company) throw new Error('회사(CH/부강)를 먼저 선택해 주세요.');
        let rows;
        if(mode==='one'){
          const no = fNo.value.trim().toUpperCase();
          if(!/^W\d{6,}$/.test(no)) throw new Error('주문코드를 W로 시작하는 형식으로 입력해 주세요. (예: W1234567890)');
          if(!fModel.value.trim()) throw new Error('모델명을 입력해 주세요.');
          rows = [rowOf({order_no:no, model_raw:fModel.value.trim(), qty, order_date:fDate.value, ship_to:ship, window_text:fWin.value.trim()})];
          if(fWin.value.trim() && !parseWindow(fWin.value)) throw new Error('배송 예정 기간을 읽지 못했습니다. 예: 11월 25 - 11월 27 (또는 비워 두세요)');
        } else {
          rows = parsePaste(ta.value).map(rowOf);
          if(!rows.length) throw new Error('붙여넣은 내용에서 주문코드(W…)가 있는 줄을 찾지 못했습니다.');
        }
        const { data, error } = await sb.rpc('online_import_orders', { p_rows: rows, p_apply: false });
        if(error) throw error;
        const res = data||[]; const cnt = {}; res.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
        out.className='card';
        out.appendChild(h('div',{style:'font-weight:700;margin-bottom:6px',text:'미리보기 · '+rows.length+'건 · 회사 '+company}));
        Object.keys(LABEL).forEach(k=>{ if(cnt[k]) out.appendChild(h('div',{class:LABEL[k][0],style:'margin:2px 0',text:LABEL[k][1]+' '+cnt[k]+'건'})); });
        const okRows = res.filter(r=>r.status==='new'||r.status==='complete');
        const noShip = rows.filter(r=>!r.ship_to && okRows.some(n=>n.order_no===r.order_no)).length;
        if(noShip) out.appendChild(h('div',{class:'err',style:'margin-top:6px',text:'⚠ 배송지(서울/부산)가 비어 있는 주문 '+noShip+'건 — 저장은 되지만 사무실 불일치 확인이 되지 않습니다. 위에서 배송지를 선택해 주세요.'}));
        if(okRows.length){
          const t = h('table',{class:'cotable',style:'margin-top:8px'}); t.appendChild(h('thead',{html:'<tr><th>주문코드</th><th>모델</th><th>수량</th><th>주문일</th><th>배송지</th></tr>'}));
          const tb = h('tbody'); okRows.slice(0,50).forEach(r=>{ const x = rows.find(y=>y.order_no===r.order_no)||{}; tb.appendChild(h('tr',{},[h('td',{class:'co',text:x.order_no}),h('td',{style:'white-space:normal',text:itemName(x.model_raw)||x.model_raw}),h('td',{text:(x.qty||'')+'대'}),h('td',{text:x.order_date||'-'}),h('td',{text:x.ship_to||'-'})])); });
          t.appendChild(tb); out.appendChild(h('div',{style:'overflow-x:auto'},[t]));
          const ok = h('button',{class:'btn-primary',style:'margin-top:10px',text:'신규 '+okRows.length+'건 저장'});
          ok.onclick = async ()=>{
            ok.disabled = true;
            const { data:d2, error:e2 } = await sb.rpc('online_import_orders', { p_rows: rows, p_apply: true });
            if(e2){ err.textContent=e2.message; err.className='err'; ok.disabled=false; return; }
            const n = (d2||[]).filter(r=>r.status==='new'||r.status==='complete').length;
            out.innerHTML=''; out.appendChild(h('div',{class:'ok',style:'font-weight:700',text:'✓ '+n+'건 저장했습니다. 집계의 "배송 전"에 반영됩니다.'}));
            fNo.value=''; fModel.value=''; fWin.value=''; ta.value='';
          };

  function drawOnlineOrders(body){

      const m = String(txt||'').match(/(\d+)\s*월\s*(\d+)\s*-\s*(\d+)\s*월\s*(\d+)/); if(!m || !base) return {};
      const y0 = Number(base.slice(0,4)), bm = Number(base.slice(5,7));

      return { window_from: mk(+m[1],+m[2]), window_to: mk(+m[3],+m[4]) };
    };
    // "주문 추적 표(자동 생성)" 형식: 운영사 / 주문 상태 / 주문일 / 운송장번호 / 모델 / 수량 / 주문번호 / 추적 링크
    const coOfName = n=> /^CH\b|CH NETWORK/i.test(n)?'CH':/BUGANG|부강/i.test(n)?'부강':/성신|SEONGSIN|SUNGSIN/i.test(n)?'성신':/에잇|EIGHT|8SYNC/i.test(n)?'에잇싱크':'';
    function readStatusTable(X, wb){
      const aoa = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd'});
      const hdr = (aoa[0]||[]).map(x=>String(x));
      const fc = (...k)=> hdr.findIndex(x=>k.some(y=>x.includes(y)));
      const io = fc('订单号'), im = fc('产品型号'), iq = fc('下单数量','数量'), id = fc('下单日'), ic = fc('运营公司'), it = fc('快递单号'), ist = fc('订单状态');
      if(io<0 || im<0) throw new Error('주문번호 열(订单号)과 모델 열(产品型号)을 찾지 못했습니다.');
      const rows = []; let withTracking = 0, unknownCo = 0;
      aoa.slice(1).forEach(r=>{
        const on = String(r[io]||'').trim(); if(!/^W\d{6,}$/i.test(on)) return;

        const od = dm ? dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0') : '';

        rows.push({ order_no:on.toUpperCase(), model_raw:String(r[im]||'').trim(), qty: iq>=0 ? (parseInt(r[iq],10)||2) : 2, order_date: od, company: co, status_txt: ist>=0?String(r[ist]||''):'' });
      });
      if(!rows.length) throw new Error('등록할 주문을 찾지 못했습니다.');
      return { rows, skipped:0, withTracking, unknownCo, fromStatusTable:true };
    }
    async function readOrders(f){
      const X = await loadSheetJS();
      const wb = X.read(await f.arrayBuffer(), {type:'array', cellDates:true, dateNF:'yyyy-mm-dd'});
      { const k = sniffKind(X, wb); if(k==='delivery'||k==='tracking') throw wrongTab(...WRONG[k]); if(k==='status') return readStatusTable(X, wb); }
      const main = wb.Sheets['总单'] ? '总单' : wb.SheetNames[0];
      const aoa = X.utils.sheet_to_json(wb.Sheets[main], {header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd'});
      let hdr = aoa[0]||[];
      let io = hasH(hdr,'订单号'), im = hasH(hdr,'型号'), iq = hasH(hdr,'数量'), id = hasH(hdr,'下单日期'), iw = hasH(hdr,'日期');
      let startRow = 1, cardCols0 = null, ip0 = -1;
      if(io<0 || im<0){
        // 수기 온라인 구매 장부 형식: 제목이 2줄(한글+중문), 주문코드(订单码) 열을 사용
        const h2 = (aoa[0]||[]).map((_,i)=> String(aoa[0][i]||'')+' '+String((aoa[1]||[])[i]||''));
        const fc = (...k)=> h2.findIndex(x=>k.some(y=>x.includes(y)));
        io = fc('订单码'); im = fc('产品型号'); iq = fc('数量'); id = fc('下单日'); iw = fc('取单时间');
        if(io<0 || im<0) throw new Error('주문번호 열(订单号 또는 订单码)과 모델 열(型号)을 찾지 못했습니다. 자동주문 프로그램 엑셀(总单 시트)이나 온라인 구매 장부 엑셀을 올려 주세요.');
        startRow = 2; hdr = h2.map(x=>x.trim()); cardCols0 = h2.map((x,i)=>x.includes('银行卡号')?i:-1).filter(i=>i>=0); ip0 = fc('省/市');
      }
      const cardCols = cardCols0 || hdr.map((x,i)=>String(x).trim()==='卡号'?i:-1).filter(i=>i>=0);
      const ip = ip0>=0 ? ip0 : hdr.findIndex(x=>['省、市、地区','省、市'].includes(String(x).trim()));
      // 대조 시트: 결제 실패 등 정상 완료가 아닌 주문은 제외
      const bad = {};
      const rs = wb.SheetNames.find(n=>/对账/.test(n));
      if(rs){ const ra = X.utils.sheet_to_json(wb.Sheets[rs],{header:1,raw:false,defval:''}); const rh = ra[0]||[]; const ro = rh.indexOf('订单号'), rt = rh.indexOf('状态');
        if(ro>=0 && rt>=0) ra.slice(1).forEach(r=>{ if(r[ro] && r[rt] && r[rt]!=='writeback_done') bad[String(r[ro]).trim()] = r[rt]; }); }
      const rows = []; let skipped = 0;
      aoa.slice(startRow).forEach(r=>{
        const on = String(r[io]||'').trim(); if(!/^W\d{6,}$/i.test(on)) return;

        let l4 = ''; for(const ci of cardCols){ const d = String(r[ci]||'').replace(/\D/g,''); if(d.length>=4){ l4 = d.slice(-4); break; } }
        const prov = ip>=0 ? String(r[ip]||'') : '';
        const dm = id>=0 ? String(r[id]||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/) : null;
        const od = dm ? dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0') : '';
        const wt = iw>=0 ? String(r[iw]||'').trim() : '';
        rows.push({ order_no:on, model_raw:String(r[im]||'').trim(), qty: iq>=0 ? (parseInt(r[iq],10)||2) : 2, order_date: /^\d{4}-\d{2}-\d{2}$/.test(od)?od:'', window_text:wt, ...monthDay(wt, od), card_last4:l4, ship_to: prov.includes('서울')?'서울':prov.includes('부산')?'부산':'' });
      });
      if(!rows.length) throw new Error('등록할 주문을 찾지 못했습니다.');
      return { rows, skipped };
    }
    const LABEL = {new:['ok','신규 등록'], complete:['ok','딩톡에서 먼저 가져온 건 → 주문 정보 보완 (운송장·수령 기록은 그대로)'], exists:['muted','이미 등록됨 (건너뜀)'], dup_in_file:['err','파일 안에서 중복 (건너뜀)'], unknown_card:['err','회사가 정해지지 않은 카드 (저장 안 함)'], bad_row:['err','주문번호 형식 오류 (건너뜀)']};
    async function preview(){

        // 회사가 정해지지 않은 카드: 바로 지정
        const unk = Array.from(new Set(res.filter(r=>r.status==='unknown_card').map(r=>r.card_last4||'')));
        unk.forEach(l4=>{

        if(newRows.length){
          const ok = h('button',{class:'btn-primary',style:'margin-top:10px',text:'신규 '+res.filter(r=>r.status==='new').length+'건 저장'+(res.some(r=>r.status==='complete')?(' + 정보 보완 '+res.filter(r=>r.status==='complete').length+'건'):'')});

    const findCol = (hdr, keys, skip)=> hdr.findIndex((x,i)=> i!==skip && keys.some(k=> String(x).toLowerCase().replace(/\s/g,'').includes(k.toLowerCase())));
    async function readFile(f){
      const X = await loadSheetJS();
      const wb = X.read(await f.arrayBuffer(), {type:'array'});
      { const k = sniffKind(X, wb); if(k==='delivery'||k==='order') throw wrongTab(...WRONG[k]); }
      const out = [];

      const row = { k:++seq, tracking:trk, qty:qtyForRow||qty, office:officeForRow||office, status:'checking', info:null, msg:'', rid:null };
      rows.push(row); lookups.push(row); render();
      clearTimeout(lookTimer); lookTimer = setTimeout(runLookups, 120);
    }
    async function runLookups(){
      if(looking || !lookups.length) return; looking = true;
      const batch = lookups.splice(0,50);
      let data = null, fail = null;
      for(let a=0; a<3 && !data; a++){
        try{ const r = await sb.rpc('online_find_many', { p_trackings: batch.map(b=>b.tracking) }); if(r.error) throw r.error; data = r.data||[]; }
        catch(e){ fail = e.message||String(e); await new Promise(res=>setTimeout(res, 500*(a+1))); }
      }
      let anyBad = false;
      batch.forEach(row=>{
        if(!data){ row.status='failed'; row.msg='조회 실패('+fail+') — ✕로 지우고 다시 스캔하세요'; anyBad = true; return; }
        const f = data.find(x=>x.tracking===row.tracking);
        if(!f || !f.found){ row.status='notfound'; row.msg='운송장 파일이 아직 등록되지 않았을 수 있습니다'; anyBad = true; }
        else { row.info = f;
          if(f.already){ row.status='already'; row.msg=(f.received_by||'')+' '+onlineTime(f.received_at)+(f.source&&f.source!=='scan'?' ('+f.source+')':''); anyBad = true; }
          else { row.status='ready'; if(f.qty && row.qty>f.qty) row.qty=f.qty; } }
      });
      beep(!anyBad); render(); saveDraft(); looking = false;
      if(lookups.length) runLookups();
    }

    // --- 자동 인식 (Enter 없이): 입력이 0.15초 멈추면 한 건 ---
    let idle = null;
    const consume = ()=>{ const v = inp.value; if(!v.trim()) return; inp.value=''; v.split(/[\s,;]+/).filter(Boolean).forEach(x=>addScan(x)); };
    inp.addEventListener('input', ()=>{ clearTimeout(idle); const v = inp.value.trim(); if(/[\s,;]/.test(v)){ consume(); return; } if(v.length>=8) idle = setTimeout(consume, 150); });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(idle); consume(); e.preventDefault(); } });
    inp.addEventListener('blur', ()=> setTimeout(()=>{ if(document.activeElement===document.body) inp.focus(); }, 150));

    // --- 제출 ---
    submitBtn.onclick = async ()=>{
      const todo = rows.filter(r=>r.status==='ready'); if(!todo.length) return;
      todo.forEach(r=>r.status='submitting'); render(); msg.textContent='';
      let ok = 0, units = 0, problems = 0;
      for(let i=0;i<todo.length;i+=50){
        const chunk = todo.slice(i,i+50);
        let data = null, fail = null;
        for(let a=0; a<3 && !data; a++){
          try{ const r = await sb.rpc('online_receive', { p_items: chunk.map(c=>({tracking:c.tracking, qty:c.qty, ship_to:c.office})) }); if(r.error) throw r.error; data = r.data||[]; }
          catch(e){ fail = e.message||String(e); await new Promise(res=>setTimeout(res, 600*(a+1))); }
        }
        chunk.forEach(row=>{
          if(!data){ row.status='ready'; row.msg=''; problems++; return; }   // 저장 결과를 모를 때: 제출 대기로 되돌림 (서버가 중복을 막아 안전)
          const x = data.find(d=>d.tracking===row.tracking);
          if(x && x.status==='ok'){ row.status='done'; row.rid=x.receipt_id; row.qty=x.qty; ok++; units+=x.qty; }
          else if(x && x.status==='already'){ row.status='already'; row.msg=(x.by||'')+' '+onlineTime(x.received_at); problems++; }
          else { row.status='failed'; row.msg=x?x.status:'응답 없음'; problems++; }
        });
        if(!data){ msg.style.color='var(--danger)'; msg.textContent = '✗ 저장 실패: '+fail+' — 제출 대기로 남겨 두었습니다. 잠시 후 다시 [제출]을 누르세요.'; }
      }
      beep(problems===0); saveDraft(); render(); loadToday();
      if(!msg.textContent){ msg.style.color = problems?'var(--danger)':'var(--success)'; msg.textContent = '✓ '+ok+'박스 · '+units+'대 제출 완료'+(problems?(' · 확인 필요 '+problems+'건'):''); }
      inp.focus();
    };
    clearBtn.onclick = ()=>{
      const n = rows.filter(r=>r.status==='ready'||r.status==='checking'||r.status==='already'||r.status==='notfound'||r.status==='failed').length;
      if(!n || !confirm('제출 전 목록 '+n+'건을 모두 지울까요? (이미 제출 완료된 줄은 그대로입니다)')) return;
      for(let i=rows.length-1;i>=0;i--) if(rows[i].status!=='done' && rows[i].status!=='voided' && rows[i].status!=='submitting') rows.splice(i,1);
      saveDraft(); render(); inp.focus();
    };
    window.onbeforeunload = e=>{ if(rows.some(r=>r.status==='ready'||r.status==='checking')){ e.preventDefault(); e.returnValue=''; return ''; } };

    async function loadToday(){
      const { data, error } = await sb.rpc('online_my_today');
      todayBox.innerHTML='';
      if(error){ todayBox.appendChild(h('div',{class:'err',text:error.message})); return; }
      const list = data||[];
      todayBox.appendChild(h('div',{class:'flexbetween',style:'margin-bottom:6px'},[
        h('div',{style:'font-weight:700',text:'오늘 내가 제출한 박스'}),
        h('div',{class:'muted',text:(list.length?Number(list[0].boxes):0)+'박스 · '+(list.length?Number(list[0].units):0)+'대 (최근 100건 표시)'})
      ]));
      if(!list.length) todayBox.appendChild(h('div',{class:'muted',text:t('none')}));
      list.forEach(r=>{
        todayBox.appendChild(h('div',{class:'itemline'},[
          h('div',{},[h('div',{class:'mono',text:r.tracking}),h('div',{class:'muted',text:[r.company,r.qty+'대',new Date(r.received_at).toLocaleTimeString('ko-KR',{hour12:false,timeZone:'Asia/Seoul'})].join(' · ')})])
        ]));
      });
    }
    // 임시 저장된 제출 전 목록 복원
    try{ const d = JSON.parse(localStorage.getItem('pm_online_draft')||'[]'); d.forEach(x=>addScan(x.tracking, x.qty, x.office)); if(d.length){ msg.style.color='var(--accent)'; msg.textContent = '이전에 제출하지 않은 '+d.length+'건을 불러왔습니다. 확인 후 제출하세요.'; } }catch(e){}
    render(); loadToday();
    setTimeout(()=>inp.focus(), 50);
  }

      app.appendChild(tabs);
    }
    const body = h('div',{id:'tabbody'});

    cell.appendChild(h('span',{class:'pill',text:'x'+row.qty}));

    eb.onclick = ()=>{
      editFromAll = true;
      if(kind==='purchase'){ editingPurchase = row; purchaseTab = 'mine'; }
      else { editingSupplier = row; supplierTab = 'mine'; }
      drawDashboard(); window.scrollTo({top:0,behavior:'smooth'});
    };
    cell.appendChild(eb);
    const vb = h('button',{type:'button',class:'btn-danger btn-sm',text:t('cancel')});
    let armed = false;
    vb.onclick = async ()=>{

  function drawTargetCard(body){
    const card = h('div',{class:'card'});
    const canSet = !!(myProfile && myProfile.role === 'admin');
    const head = h('div',{class:'flexbetween'});
    head.appendChild(h('label',{text:t('targetTitle'),style:'margin:0'}));
    const dInput = h('input',{type:'date',value:progressDate,style:'max-width:150px'});
    head.appendChild(dInput); card.appendChild(head);
    const list = h('div',{style:'margin-top:8px'}); card.appendChild(list);
    const foot = h('div',{class:'muted',style:'margin-top:6px;font-size:12px',text:t('targetAuto')}); card.appendChild(foot);
    const editorWrap = h('div'); card.appendChild(editorWrap);
    let rows = [], editing = false;
    async function load(){
      const { data, error } = await sb.rpc('get_daily_progress', { p_date: dInput.value });
      if(error) return;
      rows = data || []; renderList();
    }
    function renderList(){
      list.innerHTML = '';
      if(!rows.length){ list.appendChild(h('div',{class:'muted',text:t('targetNone')})); return; }
      rows.forEach(r=>{
        const left = r.target - r.bought;
        const spec = [r.model, r.capacity, r.color].filter(Boolean).join(' · ');
        const status = left>0 ? t('targetLeft')+' '+left : (left===0 ? t('targetDone') : t('targetOver',{n:-left}));
        list.appendChild(h('div',{class:'flexbetween',style:'padding:7px 0;border-bottom:1px solid var(--border);gap:8px'},[
          h('span',{text:spec,style:'min-width:0'}),
          h('span',{style:'font-weight:700;white-space:nowrap;'+(left<0?'color:var(--danger)':''),text:r.bought+' / '+r.target+'  ·  '+status})
        ]));
      });
    }
    dInput.onchange = ()=>{ progressDate = dInput.value; load(); };
    if(canSet){
      const setBtn = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('targetSet'),style:'margin-top:8px'});
      card.insertBefore(setBtn, editorWrap);
      setBtn.onclick = ()=>{
        if(editing){ editing=false; editorWrap.innerHTML=''; setBtn.textContent=t('targetSet'); return; }
        editing = true; setBtn.textContent = t('targetClose');
        const lines = rows.map(r=>({model:r.model,capacity:r.capacity,color:r.color,qty:String(r.target)}));
        if(!lines.length) lines.push({model:'',capacity:'',color:'',qty:''});
        const mk = (opts,val,ph,on)=>{ const sel=h('select',{}); sel.appendChild(h('option',{value:'',text:ph})); opts.forEach(o=>sel.appendChild(h('option',{value:o,text:o}))); sel.value=val||''; sel.onchange=()=>on(sel.value); return sel; };
        const wrap = h('div',{style:'margin-top:8px'});
        const msg = h('div',{class:'muted',style:'margin-top:6px'});
        function draw(){
          wrap.innerHTML='';
          lines.forEach((l,i)=>{
            const box = h('div',{style:'border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:6px'});
            box.appendChild(h('div',{class:'row'},[ mk(MODEL_OPTIONS,l.model,t('model'),v=>{ l.model=v; l.color=''; draw(); }), mk(CAPACITY_OPTIONS,l.capacity,t('capacity'),v=>{ l.capacity=v; }) ]));
            const qi = h('input',{type:'number',min:'1',step:'1',placeholder:t('qty'),value:l.qty||''}); qi.oninput=()=>{ l.qty=qi.value; };
            const rm = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('removeLine')}); rm.onclick=()=>{ lines.splice(i,1); if(!lines.length) lines.push({model:'',capacity:'',color:'',qty:''}); draw(); };
            box.appendChild(h('div',{style:'margin-top:6px'},[ mk(colorOptionsFor(l.model||MODEL_OPTIONS[0]),l.color,t('color'),v=>{ l.color=v; }) ]));
            box.appendChild(h('div',{class:'row',style:'margin-top:6px'},[ qi, rm ]));
            wrap.appendChild(box);
          });
        }
        draw();
        const add = h('button',{type:'button',class:'btn-ghost',text:t('addLine'),style:'width:100%'});
        add.onclick = ()=>{ const last=lines[lines.length-1]; lines.push({model:last?last.model:'',capacity:'',color:'',qty:''}); draw(); };
        const save = h('button',{type:'button',class:'btn-primary',text:t('targetSave'),style:'margin-top:8px'});
        save.onclick = async ()=>{
          save.disabled = true;
          const items = lines.filter(l=>l.model&&l.capacity&&parseInt(l.qty)>0).map(l=>({model:l.model,capacity:l.capacity,color:l.color||'',qty:parseInt(l.qty)}));
          const { error } = await sb.rpc('set_daily_targets', { p_date: dInput.value, p_items: items });
          save.disabled = false;
          if(error){ msg.className='err'; msg.textContent=error.message; return; }
          editing=false; editorWrap.innerHTML=''; setBtn.textContent=t('targetSet'); load();
        };
        editorWrap.innerHTML=''; editorWrap.appendChild(wrap); editorWrap.appendChild(add); editorWrap.appendChild(save); editorWrap.appendChild(msg);
      };
    }
    body.appendChild(card);
    load();
    progressTimer = setInterval(()=>{ if(!editing) load(); }, 30000);
  }

    card.appendChild(h('div',{class:'row'},[
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('cardCo')})); d.appendChild(cardCoSel); return d; })(),
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('cardNum')})); d.appendChild(cardNumInput); return d; })()
    ]));

    card.appendChild(h('label',{text:t('noteOptional')}));
    const noteInput = h('input',{placeholder:'', value: (ed && ed.note) || ''});
    card.appendChild(noteInput);

    const err = h('div',{class:'err hidden'});
    card.appendChild(err);
    let pendingWarn = null;
    const btn = h('button',{class:'btn-primary',text: ed ? t('editDone') : t('addPurchase')});
    btn.onclick = async ()=>{
      err.className='err hidden';
      if(!sel.value){ err.textContent=t('selectStore'); err.className='err'; return; }
      if(!modelSel.value){ err.textContent=t('selectModel'); err.className='err'; return; }
      if(!capSel.value){ err.textContent=t('selectCapacity'); err.className='err'; return; }
      if(!colorSel.value){ err.textContent=t('selectColor'); err.className='err'; return; }
      const qty = parseInt(qtyInput.value);
      if(!qty || qty < 1){ err.textContent=t('checkQty'); err.className='err'; return; }
      // 목표 수량 초과/목표에 없는 품목이면 한 번 경고하고, 다시 누르면 저장 (막지는 않음)
      try{
        const { data: prog } = await sb.rpc('get_daily_progress', { p_date: dateInput.value });
        if(prog && prog.length){
          const m = prog.find(r=>r.model===modelSel.value && r.capacity===capSel.value && (r.color||'')===(colorSel.value||''));
          let warnMsg = '';
          if(!m) warnMsg = t('warnNoTarget');
          else {
            const sameKey = ed && ed.purchase_date===dateInput.value && ed.model===modelSel.value && ed.capacity===capSel.value && (ed.color||'')===(colorSel.value||'');
            const left = m.target - m.bought + (sameKey ? ed.qty : 0);
            if(qty > left) warnMsg = t('warnOver',{a:Math.max(left,0), b:qty});
          }
          if(warnMsg && pendingWarn !== warnMsg){
            pendingWarn = warnMsg; err.textContent = warnMsg; err.className='err'; btn.textContent = t('saveAnyway'); return;
          }
        }
      }catch(e){}
      btn.disabled=true; btn.textContent=t('saving');

      cancelBtn.onclick = ()=>{ editingPurchase = null; if(editFromAll){ editFromAll = false; purchaseTab = 'all'; } drawDashboard(); };
      card.appendChild(cancelBtn);
    }
    body.appendChild(card);
    if(ed && editFromAll) return; // 전체 현황에서 온 수정은 수정 폼만 보여준다

    const copyCard = h('div',{class:'card'});

      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('toDate')})); d.appendChild(copyTo); return d; })()

    const storeBtn = h('button',{type:'button',class:'chip-btn',text:t('byStore')});
    dayBtn.onclick = ()=>{ copyGroupBy='day'; dayBtn.classList.add('selected'); storeBtn.classList.remove('selected'); };
    storeBtn.onclick = ()=>{ copyGroupBy='store'; storeBtn.classList.add('selected'); dayBtn.classList.remove('selected'); };
    groupRow.appendChild(dayBtn); groupRow.appendChild(storeBtn);
    copyCard.appendChild(groupRow);

            ]));

        h('div',{style:'font-weight:700',text:t('totalCount',{n:rows.length,q:totalQty})})
      ]));

      // ---- 딩톡 업로드용 내보내기 ----
      (function(){
        const CARD_KEY = 'pm_card_numbers';
        const getSaved = ()=>{ try{ return localStorage.getItem(CARD_KEY) || ''; }catch(e){ return ''; } };
        const exp = h('div',{class:'card'});
        exp.appendChild(h('div',{style:'font-weight:700',text:t('dingTitle')}));
        exp.appendChild(h('div',{class:'muted',style:'margin:4px 0 8px;font-size:12.5px',text:t('dingDesc')}));
        exp.appendChild(h('label',{text:t('dingCards')}));
        const ta = h('textarea',{rows:'4',placeholder:'1234 5678 9012 8482\n...',style:'width:100%'});
        ta.value = getSaved();
        let lastSaved = null;
        const saveServer = async ()=>{
          const v = ta.value;
          try{ localStorage.setItem(CARD_KEY, v); }catch(e){}
          if(v === lastSaved) return;
          try{ const {error} = await sb.rpc('set_ding_cards',{p_cards:v}); if(!error) lastSaved = v; }catch(e){}
        };
        (async ()=>{
          try{
            const {data} = await sb.rpc('get_ding_cards');
            if(typeof data === 'string'){
              if(data.trim()){ ta.value = data; lastSaved = data; try{ localStorage.setItem(CARD_KEY, data); }catch(e){} }
              else if(ta.value.trim()){ saveServer(); }   // 서버가 비어 있으면 이 브라우저 값을 올림
              else lastSaved = '';
            }
          }catch(e){}
        })();
        ta.addEventListener('change', saveServer);
        exp.appendChild(ta);
        exp.appendChild(h('div',{class:'muted',style:'font-size:12px;margin-bottom:8px',text:t('dingCardsHint')}));
        const msg = h('div',{class:'err',style:'white-space:pre-line;margin:0 0 8px'});
        function build(){
          saveServer();
          const map = {}, dups = [];
          ta.value.split(/\n/).forEach(line=>{
            const digits = line.replace(/\D/g,'');
            if(digits.length < 12) return;
            const l4 = digits.slice(-4);
            if(map[l4] && map[l4]!==digits) dups.push(l4); else map[l4] = digits;
          });
          const agg = new Map();
          rows.forEach(r=>{
            const l4 = (r.card_last4||'').replace(/\D/g,'').slice(-4);
            // 딩톡 모델명 형식: iphone18pro 512GB burgundy kr spec / iphone duo 256GB night sky kr spec
            const mdl = /duo/i.test(r.model||'') ? 'iphone duo' : (r.model||'').toLowerCase().replace(/\s+/g,'');
            const label = [mdl, r.capacity, (r.color||'').toLowerCase(), 'kr spec'].filter(Boolean).join(' ');
            const key = l4+'|'+label;
            if(!agg.has(key)) agg.set(key,{l4,label,qty:0,unit:((DING_UNIT_PRICE[r.model]||{})[r.capacity])||null,name:[r.model,r.capacity].join(' ')});
            agg.get(key).qty += r.qty;
          });
          const missing = new Set(), noPrice = new Set();
          const out = [...agg.values()].sort((a,b)=>a.l4.localeCompare(b.l4)||a.label.localeCompare(b.label)).map(x=>{
            let card = '';
            if(x.l4){ card = map[x.l4] ? map[x.l4].replace(/(\d{4})(?=\d)/g,'$1-') : ''; if(!card){ missing.add(x.l4); card = '****'+x.l4; } }  // 1234-5678-9012-3456 형식
            if(x.unit==null) noPrice.add(x.name);
            return [x.label, x.qty, x.unit==null ? '' : x.unit*x.qty, '', '', card];
          });
          const warn = [];
          if(missing.size) warn.push(t('dingMissing',{n:[...missing].join(', ')}));
          if(noPrice.size) warn.push(t('dingNoPrice',{n:[...noPrice].join(', ')}));
          if(dups.length) warn.push(t('dingDupCard',{n:[...new Set(dups)].join(', ')}));
          if(fromInput.value !== toInput.value) warn.push(t('dingMulti'));
          msg.textContent = warn.join('\n');
          return out;
        }
        const btns = h('div',{class:'row'});
        const xlsxBtn = h('button',{type:'button',class:'btn-primary',text:t('dingXlsx')});
        xlsxBtn.onclick = async ()=>{
          const out = build();
          try{
            const X = await loadSheetJS();
            const ws = X.utils.aoa_to_sheet([['产品型号MODEL','下单数量QTY','下单金额AMOUNT','银行授权码BANK CODE','订单号ORDER NUMBER','支付卡号CARD NUM'], ...out]);
            ws['!cols'] = [{wch:34},{wch:12},{wch:16},{wch:20},{wch:20},{wch:24}];
            const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Sheet1');
            X.writeFile(wb, 'dingtalk_'+fromInput.value+(fromInput.value!==toInput.value?'_'+toInput.value:'')+'.xlsx');
          }catch(e){ msg.textContent = t('backupLibFail'); }
        };
        btns.appendChild(xlsxBtn);
        exp.appendChild(msg); exp.appendChild(btns);
        resultWrap.appendChild(exp);
      })();

      // 날짜별 -> 매장별 -> 구매자별로 묶어서 표시 (날짜 구분이 한눈에 보이도록)
      const WD_KO = ['일','월','화','수','목','금','토'], WD_ZH = ['周日','周一','周二','周三','周四','周五','周六'];
      const dateLabel = (iso)=>{ try{ const wd = new Date(iso+'T00:00:00').getDay(); return iso+' ('+(lang==='zh'?WD_ZH[wd]:WD_KO[wd])+')'; }catch(e){ return iso; } };
      const byDate = new Map();
      rows.forEach(r=>{ if(!byDate.has(r.purchase_date)) byDate.set(r.purchase_date, []); byDate.get(r.purchase_date).push(r); });
      byDate.forEach((dayRows, day)=>{
        const dayTotal = dayRows.reduce((a,r)=>a+r.qty,0);
        resultWrap.appendChild(h('div',{class:'flexbetween',style:'margin:14px 4px 6px;padding:8px 12px;border-radius:10px;background:var(--surface-2)'},[
          h('div',{style:'font-weight:800;font-size:15px',text:dateLabel(day)}),
          h('div',{class:'row',style:'gap:6px;align-items:center'},[
            h('span',{class:'pill',text:dayTotal+t('unit')}),
            (()=>{ const b=h('button',{type:'button',class:'btn-ghost btn-sm',text:t('copyDay')}); b.onclick=()=>copyText(buildDayReportText(dayRows,{modelTotal:t('modelTotal'),grandTotal:(lang==='zh'?'总计':'총계'),unit:t('unit')}), b); return b; })()
          ])
        ]));
        const byStore = {};
        dayRows.forEach(r=>{
          byStore[r.store_name] = byStore[r.store_name] || {};
          byStore[r.store_name][r.buyer_name] = byStore[r.store_name][r.buyer_name] || [];
          byStore[r.store_name][r.buyer_name].push(r);
        });
        Object.keys(byStore).forEach(storeName=>{
          const buyers = byStore[storeName];
          const storeTotal = Object.values(buyers).flat().reduce((a,r)=>a+r.qty,0);
          const storeCard = h('div',{class:'card'});
          storeCard.appendChild(h('div',{class:'flexbetween'},[
            h('div',{style:'font-weight:700',text:sn(storeName)}),
            h('span',{class:'pill',text:storeTotal+t('unit')})
          ]));
          Object.keys(buyers).forEach(buyerName=>{
            const items = buyers[buyerName];
            const buyerTotal = items.reduce((a,r)=>a+r.qty,0);
            storeCard.appendChild(h('hr',{}));
            storeCard.appendChild(h('div',{class:'flexbetween'},[
              h('div',{style:'font-weight:600',text:buyerName}),
              h('span',{class:'pill',text:buyerTotal+t('unit')})
            ]));
            items.forEach(it=>{
              const cardInfo = [it.card_company, it.card_last4].filter(Boolean).join(' ');
              storeCard.appendChild(h('div',{class:'itemline'},[
                h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim() + (cardInfo?' · '+cardInfo:'')},[]),
                rowRightCell(it,'purchase',load)
              ]));
            });
          });
          resultWrap.appendChild(storeCard);
        });
      });

      // model summary
      const byModel = {};
      rows.forEach(r=>{
        const key = `${r.model} ${r.capacity||''} ${r.color||''}`.replace(/\s+/g,' ').trim();
        byModel[key] = (byModel[key]||0) + r.qty;
      });
      const modelCard = h('div',{class:'card'});
      modelCard.appendChild(h('label',{text:t('modelTotal')}));
      Object.keys(byModel).forEach(key=>{
        modelCard.appendChild(h('div',{class:'itemline'},[h('span',{text:key}), h('span',{class:'pill',text:byModel[key]+t('unit')})]));
      });
      const grandQty = Object.values(byModel).reduce((a,b)=>a+b,0);
      modelCard.appendChild(h('div',{class:'itemline',style:'font-weight:700'},[h('span',{text:t('grandTotal')}), h('span',{class:'pill',text:grandQty+t('unit')})]));
      const allCopyBtn = h('button',{type:'button',class:'btn-primary',style:'margin-top:10px;width:100%',text:t('copyAllRange')});
      allCopyBtn.onclick = ()=>copyText(buildDayReportText(rows,{modelTotal:t('modelTotal'),grandTotal:(lang==='zh'?'总计':'총계'),unit:t('unit')}), allCopyBtn);
      modelCard.appendChild(allCopyBtn);
      resultWrap.appendChild(modelCard);
    }
    loadBtn.onclick = load;
    load();
  }

  function loadSheetJS(){
    return new Promise((resolve,reject)=>{
      if(window.XLSX) return resolve(window.XLSX);
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = ()=> window.XLSX ? resolve(window.XLSX) : reject(new Error('xlsx'));
      sc.onerror = ()=> reject(new Error('xlsx'));
      document.head.appendChild(sc);
    });
  }

          ['알바품목', (data.session_items||[]).map(r=>({'생성일시':fmtTime(r.created_at),'매장':r.store_name,'알바명':r.alba_name,'모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty}))],
          ['구매기록', (data.purchases||[]).map(r=>({'구매일':r.purchase_date,'매장':r.store_name,'입력자':r.buyer_name||'','모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty,'카드회사':r.card_company||'','카드끝4자리':r.card_last4||'','메모':r.note||'','입력일시':fmtTime(r.created_at),'취소됨':r.voided?'Y':''}))],
          ['공급업체', (data.supplier_orders||[]).map(r=>({'받은날짜':r.received_date,'공급업체':r.company_name,'입력자':r.buyer_name||'','모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty,'단가(원)':r.unit_price===null||r.unit_price===undefined?'':Number(r.unit_price),'금액(원)':r.amount===null?'':Number(r.amount),'명세서ID':r.batch_id||'','메모':r.note||'','입력일시':fmtTime(r.created_at),'취소됨':r.voided?'Y':''}))],
          ['삭제된알바기록', (data.deleted_sessions||[]).map(r=>({'삭제일시':fmtTime(r.deleted_at),'삭제자':r.deleted_by_name||'','매장':r.store_name||'','알바명':r.alba_name||'','상태':r.status||'','생성일시':fmtTime(r.created_at),'제출내용':r.note||'','주문번호':r.orders||'','품목(원본)':r.items||''}))]

      }catch(e){ err.textContent = e.message || String(e); err.className='err'; }
      btn.disabled = false; btn.textContent = old;
    };

  function drawSupplierBatchForm(body){
    const card = h('div',{class:'card'});
    const scanFile = h('input',{type:'file',accept:'image/*',style:'display:none'});
    const scanBtn = h('button',{type:'button',class:'btn-primary',text:t('scanBtn'),style:'width:100%;margin-bottom:10px'});
    const scanMsg = h('div',{class:'muted',style:'margin-bottom:10px;white-space:pre-line'});
    if(SCAN_ENABLED){ card.appendChild(scanFile); card.appendChild(scanBtn); card.appendChild(scanMsg); }
    scanBtn.onclick = ()=>scanFile.click();
    card.appendChild(h('label',{text:t('companyName')}));
    const companyInput = h('input',{placeholder:t('companyNamePh')});
    card.appendChild(companyInput);
    card.appendChild(h('label',{text:t('receivedDate'),style:'margin-top:8px'}));
    const dateInput = h('input',{type:'date',value:new Date().toISOString().slice(0,10)});
    card.appendChild(dateInput);
    card.appendChild(h('label',{text:t('batchLines'),style:'margin-top:12px'}));

    const linesWrap = h('div');
    card.appendChild(linesWrap);
    const totalBox = h('div',{style:'margin-top:10px;font-weight:700;text-align:right'});
    const lines = []; // {model,capacity,color,qty,unit}
    const mkSelect = (opts, val, placeholder, onchg)=>{
      const sel = h('select',{});
      sel.appendChild(h('option',{value:'',text:placeholder}));
      opts.forEach(o=>sel.appendChild(h('option',{value:o,text:o})));
      sel.value = val||''; sel.onchange = ()=>onchg(sel.value);
      return sel;
    };
    function recalc(){
      const q = lines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
      const amt = lines.reduce((a,l)=>a+((parseInt(l.qty)||0)*(Number(l.unit)||0)),0);
      totalBox.textContent = t('batchTotal')+': '+q+t('unit')+(amt?' · '+fmtWon(amt)+t('wonUnit'):'');
      lines.forEach(l=>{ if(l._totalEl){ const v=(parseInt(l.qty)||0)*(Number(l.unit)||0); l._totalEl.textContent = v? t('lineTotal')+' '+fmtWon(v)+t('wonUnit') : ''; } });
    }
    function drawLines(){
      linesWrap.innerHTML = '';
      lines.forEach((l,i)=>{
        const box = h('div',{style:'border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px'});
        const top = h('div',{class:'flexbetween',style:'margin-bottom:6px'});
        top.appendChild(h('span',{class:'muted',style:'font-weight:700',text:'#'+(i+1)}));
        if(lines.length>1){
          const rm = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('removeLine')});
          rm.onclick = ()=>{ lines.splice(i,1); drawLines(); };
          top.appendChild(rm);
        }
        box.appendChild(top);
        const colorSel = mkSelect(colorOptionsFor(l.model||MODEL_OPTIONS[0]), l.color, t('color'), v=>{ l.color=v; });
        box.appendChild(h('div',{class:'row'},[
          mkSelect(MODEL_OPTIONS, l.model, t('model'), v=>{ l.model=v; l.color=''; drawLines(); }),
          mkSelect(CAPACITY_OPTIONS, l.capacity, t('capacity'), v=>{ l.capacity=v; })
        ]));
        box.appendChild(h('div',{style:'margin-top:6px'},[colorSel]));
        const qtyI = h('input',{type:'number',min:'1',step:'1',placeholder:t('qty'),value:l.qty||''});
        qtyI.oninput = ()=>{ l.qty=qtyI.value; recalc(); };
        const unitI = h('input',{type:'number',min:'0',step:'1',placeholder:t('unitPrice'),value:l.unit||''});
        unitI.oninput = ()=>{ l.unit=unitI.value; recalc(); };
        box.appendChild(h('div',{class:'row',style:'margin-top:6px'},[qtyI, unitI]));
        l._totalEl = h('div',{class:'muted',style:'margin-top:4px;text-align:right'});
        box.appendChild(l._totalEl);
        linesWrap.appendChild(box);
      });
      recalc();
    }
    const addLine = (copyFrom)=>{
      lines.push({model:copyFrom?copyFrom.model:'', capacity:'', color:'', qty:'', unit:copyFrom?copyFrom.unit:''});
    };
    addLine(); drawLines();
    const shrinkImage = (file)=>new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = ()=>{
        const max = 2000, r = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',0.85).split(',')[1]);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
    scanFile.onchange = async ()=>{
      const f = scanFile.files && scanFile.files[0]; if(!f) return;
      scanBtn.disabled = true; scanMsg.className='muted'; scanMsg.textContent = t('scanning');
      try{
        const image = await shrinkImage(f);
        const { data, error } = await sb.functions.invoke('parse-statement', { body: { image, media_type:'image/jpeg' } });
        if(error || !data || !data.result){
          let noKey = false;
          try{ const j = await error.context.json(); noKey = j && j.error==='NO_API_KEY'; }catch(e){}
          scanMsg.className='err'; scanMsg.textContent = noKey ? t('scanNoKey') : t('scanFail'); return;
        }
        const r = data.result, warn = (r.warnings||[]).slice();
        if(r.company_name) companyInput.value = r.company_name;
        if(r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) dateInput.value = r.date;
        lines.length = 0;
        (r.items||[]).forEach(it=>lines.push({model:it.model||'', capacity:it.capacity||'', color:it.color||'', qty:it.qty?String(it.qty):'', unit:(it.unit_price==null?'':String(it.unit_price))}));
        if(lines.length===0) addLine();
        lines.forEach((l,i)=>{ if(!l.model||!l.capacity) warn.push(t('scanUnknownLine',{n:i+1})); });
        const sumQ = lines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
        if(r.total_qty && r.total_qty!==sumQ) warn.push(t('scanTotalMismatch',{a:r.total_qty,b:sumQ}));
        drawLines();
        scanMsg.className = warn.length ? 'err' : 'muted';
        scanMsg.textContent = t('scanDone') + (warn.length ? '\n'+warn.join('\n') : '');
      }catch(e){ scanMsg.className='err'; scanMsg.textContent = t('scanFail'); }
      finally{ scanBtn.disabled = false; scanFile.value=''; }
    };
    const addBtn = h('button',{type:'button',class:'btn-ghost',text:t('addLine'),style:'width:100%'});
    addBtn.onclick = ()=>{ addLine(lines[lines.length-1]); drawLines(); };
    card.appendChild(addBtn);
    card.appendChild(totalBox);

    card.appendChild(h('label',{text:t('noteOptional'),style:'margin-top:10px'}));
    const noteInput = h('input',{placeholder:''});
    card.appendChild(noteInput);

          const right = h('span',{style:'margin-left:auto;display:inline-flex;gap:6px;align-items:center'});
          right.appendChild(h('span',{class:'pill',text:'x'+p.qty}));

          editBtn.onclick = ()=>{ editFromAll = false; editingSupplier = p; drawDashboard(); window.scrollTo({top:0,behavior:'smooth'}); };
          right.appendChild(editBtn);
          const vb = h('button',{class:'btn-danger btn-sm',text:t('cancel')});
          let armedL = false;
          vb.onclick = async ()=>{
            if(!armedL){ armedL=true; vb.textContent=t('confirmVoid'); setTimeout(()=>{armedL=false; vb.textContent=t('cancel');},3000); return; }
            await sb.rpc('void_supplier_order', { p_order_id: p.id });
            drawDashboard();
          };
          right.appendChild(vb);
          line.appendChild(right);
          c.appendChild(line);
        });
        if(g.batch_id && g.rows.length>1){
          const vbAll = h('button',{class:'btn-danger btn-sm',text:t('cancelBatch'),style:'margin-top:8px'});
          let armedB = false;
          vbAll.onclick = async ()=>{

            await sb.rpc('void_supplier_batch', { p_batch_id: g.batch_id });
            drawDashboard();
          };
          c.appendChild(vbAll);
        }
        listWrap.appendChild(c);
      });

      mySupplierDateFrom = myFromInput.value;
      mySupplierDateTo = myToInput.value;

  function drawAllSupplierTab(body){
    const ctrl = h('div',{class:'card'});

    ctrl.appendChild(h('div',{class:'row'},[
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('fromDate')})); const i=h('input',{type:'date',value:today}); d.appendChild(i); d._input=i; return d; })(),

    body.appendChild(ctrl);

    async function load(){
      resultWrap.innerHTML = '';
      resultWrap.appendChild(h('div',{class:'muted',text:t('loading')}));
      const { data, error } = await sb.rpc('admin_list_supplier_orders', {
        p_date_from: fromInput.value, p_date_to: toInput.value, p_company_name: null
      });
      resultWrap.innerHTML = '';
      if(error){ resultWrap.appendChild(h('div',{class:'err',text:error.message})); return; }
      const rows = data || [];
      if(rows.length===0){ resultWrap.appendChild(h('div',{class:'muted',text:t('noRecordsInPeriod')})); return; }

      const totalQty = rows.reduce((a,r)=>a+r.qty,0);
      const totalAmount = rows.reduce((a,r)=>a+(Number(r.amount)||0),0);

      // group by company -> by buyer
      const byCompany = {};
      rows.forEach(r=>{
        byCompany[r.company_name] = byCompany[r.company_name] || {};
        byCompany[r.company_name][r.buyer_name] = byCompany[r.company_name][r.buyer_name] || [];
        byCompany[r.company_name][r.buyer_name].push(r);
      });
      Object.keys(byCompany).forEach(companyName=>{
        const buyers = byCompany[companyName];
        const items = Object.values(buyers).flat();
        const companyTotal = items.reduce((a,r)=>a+r.qty,0);
        const companyAmount = items.reduce((a,r)=>a+(Number(r.amount)||0),0);
        const companyCard = h('div',{class:'card'});
        companyCard.appendChild(h('div',{class:'flexbetween'},[
          h('div',{style:'font-weight:700',text:companyName},[]),
          h('span',{class:'pill',text:companyTotal+t('unit')})
        ]));
        companyCard.appendChild(h('div',{class:'muted',style:'margin-top:2px',text:t('totalAmount')+': '+fmtWon(companyAmount)+t('wonUnit')}));
        Object.keys(buyers).forEach(buyerName=>{
          const buyerItems = buyers[buyerName];
          const buyerTotal = buyerItems.reduce((a,r)=>a+r.qty,0);
          companyCard.appendChild(h('hr',{}));
          companyCard.appendChild(h('div',{class:'flexbetween'},[
            h('div',{style:'font-weight:600',text:buyerName}),
            h('span',{class:'pill',text:buyerTotal+t('unit')})
          ]));
          const bGroups = []; const bIdx = {};
          buyerItems.forEach(it=>{
            const key = it.batch_id || ('single:'+it.id);
            if(!(key in bIdx)){ bIdx[key]=bGroups.length; bGroups.push([]); }
            bGroups[bIdx[key]].push(it);
          });
          bGroups.forEach(grp=>{
            const gAmt = grp.reduce((a,r)=>a+(Number(r.amount)||0),0);
            const gQty = grp.reduce((a,r)=>a+r.qty,0);
            companyCard.appendChild(h('div',{class:'muted',style:'margin-top:8px;font-size:12px;font-weight:700',
              text:[fmtShortDate(grp[0].received_date), grp.length>1?t('statementOf')+' '+t('lines',{n:grp.length}):'', gQty+t('unit'), gAmt?fmtWon(gAmt)+t('wonUnit'):''].filter(Boolean).join(' · ')}));
            grp.slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).forEach(it=>{
              const priceStr = it.amount!=null ? ' · '+(it.unit_price!=null?fmtWon(it.unit_price)+'×'+it.qty+' = ':'')+fmtWon(it.amount)+t('wonUnit') : '';
              companyCard.appendChild(h('div',{class:'itemline'},[
                h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim() + priceStr},[]),
                rowRightCell(it,'supplier',load)
              ]));
            });
          });
        });
        resultWrap.appendChild(companyCard);
      });

      // model summary
      const byModel = {};
      rows.forEach(r=>{
        const key = `${r.model} ${r.capacity||''} ${r.color||''}`.replace(/\s+/g,' ').trim();
        byModel[key] = (byModel[key]||0) + r.qty;
      });
      const modelCard = h('div',{class:'card'});
      modelCard.appendChild(h('label',{text:t('modelTotal')}));
      Object.keys(byModel).forEach(key=>{
        modelCard.appendChild(h('div',{class:'itemline'},[h('span',{text:key}), h('span',{class:'pill',text:byModel[key]+t('unit')})]));
      });
      const grandQty = Object.values(byModel).reduce((a,b)=>a+b,0);
      modelCard.appendChild(h('div',{class:'itemline',style:'font-weight:700'},[h('span',{text:t('grandTotal')}), h('span',{class:'pill',text:grandQty+t('unit')})]));
      modelCard.appendChild(h('div',{class:'muted',style:'margin-top:6px',text:t('totalCount',{n:rows.length,q:grandQty})}));
      modelCard.appendChild(h('div',{style:'font-weight:700;margin-top:2px',text:t('totalAmount')+': '+fmtWon(totalAmount)+t('wonUnit')}));
      resultWrap.appendChild(modelCard);
    }
    loadBtn.onclick = load;
    load();
  }
