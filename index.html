  async function drawListTab(body, status){
    // date-range controls — defaults to today, but lets you pull up a whole
    // weekend's worth of pickups (e.g. Fri–Sun) in one view.
    const ctrl = h('div',{class:'card'});
    const fromInput = h('input',{type:'date', value: listDateFrom});
    const toInput = h('input',{type:'date', value: listDateTo});
    ctrl.appendChild(h('div',{class:'row'},[
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('fromDate')})); d.appendChild(fromInput); return d; })(),
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('toDate')})); d.appendChild(toInput); return d; })()
    ]));
    const quickRow = h('div',{class:'chiprow'});
    const todayStr = new Date().toISOString().slice(0,10);
    const mk = (days, label)=>{
      const b = h('button',{type:'button', class:'chip-btn', text:label});
      b.onclick = ()=>{
        const d = new Date(); d.setDate(d.getDate()-days);
        fromInput.value = d.toISOString().slice(0,10);
        toInput.value = todayStr;
        loadBtn.click();
      };
      return b;
    };
    quickRow.appendChild(mk(0, t('today')));
    quickRow.appendChild(mk(6, t('last7')));
    quickRow.appendChild(mk(29, t('last30')));
    ctrl.appendChild(quickRow);
    const loadBtn = h('button',{class:'btn-primary',text:t('query')});
    loadBtn.onclick = ()=>{ listDateFrom = fromInput.value; listDateTo = toInput.value; drawDashboard(); };
    ctrl.appendChild(loadBtn);
    body.appendChild(ctrl);

    const listWrap = h('div');
    listWrap.appendChild(h('div',{class:'muted',text:t('loading')}));
    body.appendChild(listWrap);
    const { data, error } = await sb.rpc('list_sessions_for_range', { p_date_from: listDateFrom, p_date_to: listDateTo, p_status: status });
    listWrap.innerHTML = '';
    const refreshBtn = h('button',{class:'btn-ghost btn-sm',text:t('refresh'),style:'margin-bottom:10px'});
    refreshBtn.onclick = ()=>drawDashboard();
    listWrap.appendChild(refreshBtn);
    if(error){ listWrap.appendChild(h('div',{class:'err',text:error.message})); restoreScrollIfPending(); return; }
    const list = data || [];
    if(list.length===0){ listWrap.appendChild(h('div',{class:'muted',text:t('none')})); restoreScrollIfPending(); return; }

    // store filter — 전체 first, then one chip per store that actually has a
    // session in the current range, so a busy list can be narrowed to just one
    // store's pickups without a second round-trip to the server.
    const storeNames = [...new Set(list.map(s=>s.store_name))].sort();
    if(listStoreFilter && !storeNames.includes(listStoreFilter)) listStoreFilter = null; // stale pick from a previous range

    const cardsWrap = h('div');
    function renderCards(){
      cardsWrap.innerHTML = '';
      const filtered = listStoreFilter ? list.filter(s=>s.store_name===listStoreFilter) : list;
      if(filtered.length===0){ cardsWrap.appendChild(h('div',{class:'muted',text:t('none')})); return; }
      filtered.forEach(s=>cardsWrap.appendChild(renderSessionCard(s)));
    }

    if(storeNames.length > 1){
      const filterRow = h('div',{class:'chiprow',style:'margin-bottom:10px'});
      const chipBtns = {};
      const applyFilter = ()=>{
        Object.keys(chipBtns).forEach(key=>chipBtns[key].classList.toggle('selected', key===(listStoreFilter||'__all__')));
        renderCards();
      };
      const allChip = h('button',{type:'button', class:'chip-btn', text:t('allStores')});
      allChip.onclick = ()=>{ listStoreFilter = null; applyFilter(); };
      chipBtns['__all__'] = allChip;
      filterRow.appendChild(allChip);
      storeNames.forEach(name=>{
        const chip = h('button',{type:'button', class:'chip-btn', text:sn(name)});
        chip.onclick = ()=>{ listStoreFilter = name; applyFilter(); };
        chipBtns[name] = chip;
        filterRow.appendChild(chip);
      });
      listWrap.appendChild(filterRow);
      applyFilter();
    } else {
      listStoreFilter = null;
      renderCards();
    }
    listWrap.appendChild(cardsWrap);
    restoreScrollIfPending();

    function renderSessionCard(s){
      const card = h('div',{class:'card'});
      card.appendChild(h('div',{class:'flexbetween'},[
        h('div',{},[
          h('div',{class:'muted',style:'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em',text:sn(s.store_name)}),
          h('div',{style:'font-weight:700;font-size:16px;margin-top:2px',text:s.alba_name||t('noName')}),
          h('div',{class:'muted',style:'margin-top:2px',text:fmtDate(s.created_at, lang==='zh')})
        ]),
        h('span',{class:'statusbadge '+s.status, text: s.status==='done'?t('statusDone'):t('statusProgress')})
      ]));
      (s.orders||[]).forEach(o=>card.appendChild(h('span',{class:'pill mono',text:o})));
      if((s.items||[]).length){
        const il = h('div',{style:'margin-top:8px'});
        s.items.forEach(it=>{
          if(editingItemId === it.id){
            const editWrap = h('div',{style:'padding:8px 0;border-bottom:1px solid var(--border)'});
            const mSel = chipGroup(MODEL_OPTIONS, it.model, (m)=>colSel.setOptions(colorOptionsFor(m)));
            const cSel = chipGroup(CAPACITY_OPTIONS, it.capacity);
            const colSel = chipGroup(colorOptionsFor(it.model || MODEL_OPTIONS[0]), it.color);
            const qInput = h('input',{type:'number',min:'1',step:'1',value:String(it.qty)});
            editWrap.appendChild(h('label',{text:t('model')})); editWrap.appendChild(mSel.el);
            editWrap.appendChild(h('label',{text:t('capacity')})); editWrap.appendChild(cSel.el);
            editWrap.appendChild(h('label',{text:t('color')})); editWrap.appendChild(colSel.el);
            editWrap.appendChild(h('label',{text:t('qty')})); editWrap.appendChild(qInput);
            const itemErr = h('div',{class:'err hidden'});
            editWrap.appendChild(itemErr);
            const saveBtn = h('button',{class:'btn-primary btn-sm',text:t('save')});
            saveBtn.onclick = async ()=>{
              const qty = parseInt(qInput.value) || 0;
              if(!mSel.value || !cSel.value || !colSel.value || qty < 1){ itemErr.textContent=t('checkItem'); itemErr.className='err'; return; }
              const { error } = await sb.rpc('update_session_item', { p_item_id: it.id, p_model: mSel.value, p_capacity: cSel.value, p_color: colSel.value, p_qty: qty });
              if(error){ itemErr.textContent = error.message; itemErr.className='err'; return; }
              editingItemId = null;
              rerenderKeepScroll();
            };
            const cancelBtn = h('button',{class:'btn-ghost btn-sm',text:t('cancel'),style:'margin-left:6px',onclick:()=>{ editingItemId=null; rerenderKeepScroll(); }});
            editWrap.appendChild(saveBtn);
            editWrap.appendChild(cancelBtn);
            il.appendChild(editWrap);
          } else {
            il.appendChild(h('div',{class:'itemline'},[
              h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim()}),
              h('span',{style:'display:flex;gap:6px;align-items:center'},[
                h('span',{class:'pill',text:'x'+it.qty}),
                h('button',{class:'btn-ghost btn-sm',text:t('edit'),onclick:()=>{ editingItemId=it.id; rerenderKeepScroll(); }}),
                h('button',{class:'btn-danger btn-sm',text:t('remove'),onclick:async()=>{ await sb.rpc('remove_session_item',{p_item_id:it.id}); rerenderKeepScroll(); }})
              ])
            ]));
          }
        });
        card.appendChild(il);
      }
      if(s.status==='done'){
        const total = (s.items||[]).reduce((a,i)=>a+i.qty,0);
        if(s.arrive_time || s.complete_time){
          let overLimit = false;
          if(s.arrive_time && s.complete_time){
            const toMin = (hm)=>{ const [h,m] = hm.split(':').map(Number); return h*60+(m||0); };
            let diff = toMin(s.complete_time) - toMin(s.arrive_time);
            if(diff < 0) diff += 24*60; // crossed midnight
            overLimit = diff > 180; // 3 hours
          }
          const timeRow = h('div',{class:'muted',style:'margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap'+(overLimit?';color:var(--danger,#d64545);font-weight:700':'')});
          timeRow.appendChild(h('span',{text:[s.arrive_time?`${t('arriveLabel')} ${s.arrive_time}`:'', s.complete_time?`${t('completeLabel')} ${s.complete_time}`:''].filter(Boolean).join(' · ')}));
          if(overLimit){
            timeRow.appendChild(h('span',{style:'background:var(--danger,#d64545);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap', text:t('overtimeBadge')}));
          }
          card.appendChild(timeRow);
        }
        if(s.note){
          card.appendChild(h('div',{class:'copybox',style:'margin-top:6px',text:s.note}));
        }
        const report = `${s.store_name}\n이름 : ${s.alba_name||'이름 없음'}\n${(s.orders||[]).join('\n')}\n총 ${(s.orders||[]).length}건 ${total}대\n${(s.items||[]).map(it=>`- ${it.model} ${it.capacity||''}${it.color?' '+it.color:''} x${it.qty}`).join('\n')}${s.note?'\n메모: '+s.note:''}`;
        const rbtn = h('button',{class:'btn-ghost btn-sm',text:t('reportCopy'),style:'margin-top:8px'});
        rbtn.onclick = ()=>copyText(report, rbtn);
        card.appendChild(rbtn);

        // Shared "paid" flag — whoever handles the money transfer (e.g. 부산실장님) marks it here,
        // and since every logged-in person sees the same record, nobody double-pays.
        const paidRow = h('div',{style:'margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap'});
        if(s.paid){
          paidRow.appendChild(h('span',{class:'statusbadge done',text:t('paidBadge')}));
          if(s.paid_by_name && s.paid_at){
            paidRow.appendChild(h('span',{class:'muted',text:t('paidBy',{name:s.paid_by_name, time:fmtDate(s.paid_at, lang==='zh')})}));
          }
        }
        const paidBtn = h('button',{class: s.paid ? 'btn-ghost btn-sm' : 'btn-primary btn-sm', text: s.paid ? t('unmarkPaid') : t('markPaid')});
        paidBtn.onclick = async ()=>{
          paidBtn.disabled = true;
          await sb.rpc('mark_session_paid', { p_session_id: s.id, p_paid: !s.paid });
          rerenderKeepScroll();
        };
        paidRow.appendChild(paidBtn);
        card.appendChild(paidRow);
      }
      const delBtn = h('button',{class:'btn-danger btn-sm',text:t('remove'),style:'margin-top:8px;margin-left:8px'});
      const delConfirm = h('span',{class:'hidden muted',text:' '+t('confirmDelete')});
      let armed = false;
      delBtn.onclick = async ()=>{
        if(!armed){ armed=true; delConfirm.className='muted'; setTimeout(()=>{armed=false; delConfirm.className='hidden';},3000); return; }
        await sb.rpc('delete_session', { p_session_id: s.id });
        rerenderKeepScroll();
      };
      card.appendChild(delBtn);
      card.appendChild(delConfirm);
      return card;
    }
  }

  // builds the store x color x capacity quantity table as its own card, used only
  // by the dedicated "수량 집계" tab (kept separate from 완료 기록 so the two
  // don't get mixed up — a long session list with the summary stuck on top was
  // confusing).
  function buildQtySummaryCard(list){
    const byStoreColorCap = {}; // store -> color -> capacity -> qty
    const capTotals = {};
    let grandTotal = 0;
    list.forEach(s=>{
      (s.items||[]).forEach(it=>{
        const cap = it.capacity || '-';
        const col = it.color || '-';
        byStoreColorCap[s.store_name] = byStoreColorCap[s.store_name] || {};
        byStoreColorCap[s.store_name][col] = byStoreColorCap[s.store_name][col] || {};
        byStoreColorCap[s.store_name][col][cap] = (byStoreColorCap[s.store_name][col][cap]||0) + it.qty;
        capTotals[cap] = (capTotals[cap]||0) + it.qty;
        grandTotal += it.qty;
      });
    });
    const capsPresent = CAPACITY_OPTIONS.filter(c=>capTotals[c]);
    Object.keys(capTotals).forEach(c=>{ if(!capsPresent.includes(c)) capsPresent.push(c); });
    if(!capsPresent.length) return null;

    const sumCard = h('div',{class:'card'});
    sumCard.appendChild(h('div',{class:'sumhead'},[
      h('div',{class:'label',text:t('qtySummary')}),
      h('div',{class:'bignum'},[h('span',{text:String(grandTotal)}), h('span',{class:'u',text:t('unit')})])
    ]));

    const thead = h('thead',{},[h('tr',{},[
      h('th',{text:t('store')}),
      h('th',{text:t('color')}),
      ...capsPresent.map(c=>h('th',{text:c})),
      h('th',{text:t('qty')})
    ])]);

    const tbody = h('tbody',{});
    Object.keys(byStoreColorCap).sort().forEach(storeName=>{
      const colorMap = byStoreColorCap[storeName];
      Object.keys(colorMap).sort().forEach((colorName, idx)=>{
        const caps = colorMap[colorName];
        const rowTotal = Object.values(caps).reduce((a,n)=>a+n,0);
        const sw = COLOR_SWATCH[colorName];
        tbody.appendChild(h('tr',{},[
          h('td',{class:'storecell', text: idx===0 ? sn(storeName) : ''}),
          h('td',{},[
            sw ? h('span',{class:'colorsw',style:'background:'+sw}) : null,
            h('span',{text:colorName})
          ]),
          ...capsPresent.map(c=>h('td',{class:'qtycell'+(caps[c]?'':' zero'), text: caps[c] ? String(caps[c]) : '–'})),
          h('td',{class:'qtycell',text:String(rowTotal)})
        ]));
      });
    });

    const tfoot = h('tfoot',{},[h('tr',{},[
      h('td',{text:t('grandTotal')}),
      h('td',{text:''}),
      ...capsPresent.map(c=>h('td',{text:String(capTotals[c]||0)})),
      h('td',{text:String(grandTotal)})
    ])]);

    const tableWrap = h('div',{class:'sumwrap'});
    tableWrap.appendChild(h('table',{class:'sumtable'},[thead, tbody, tfoot]));
    sumCard.appendChild(tableWrap);
    return sumCard;
  }

  async function drawQtySummaryTab(body){
    // its own date-range controls — separate state from the 진행중/완료 기록 tabs
    // so switching tabs doesn't fight over which range is selected.
    const ctrl = h('div',{class:'card'});
    const fromInput = h('input',{type:'date', value: summaryDateFrom});
    const toInput = h('input',{type:'date', value: summaryDateTo});
    ctrl.appendChild(h('div',{class:'row'},[
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('fromDate')})); d.appendChild(fromInput); return d; })(),
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('toDate')})); d.appendChild(toInput); return d; })()
    ]));
    const quickRow = h('div',{class:'chiprow'});
    const todayStr = new Date().toISOString().slice(0,10);
    const mk = (days, label)=>{
      const b = h('button',{type:'button', class:'chip-btn', text:label});
      b.onclick = ()=>{
        const d = new Date(); d.setDate(d.getDate()-days);
        fromInput.value = d.toISOString().slice(0,10);
        toInput.value = todayStr;
        loadBtn.click();
      };
      return b;
    };
    quickRow.appendChild(mk(0, t('today')));
    quickRow.appendChild(mk(6, t('last7')));
    quickRow.appendChild(mk(29, t('last30')));
    ctrl.appendChild(quickRow);
    const loadBtn = h('button',{class:'btn-primary',text:t('query')});
    loadBtn.onclick = ()=>{ summaryDateFrom = fromInput.value; summaryDateTo = toInput.value; drawDashboard(); };
    ctrl.appendChild(loadBtn);
    body.appendChild(ctrl);

    const resultWrap = h('div');
    resultWrap.appendChild(h('div',{class:'muted',text:t('loading')}));
    body.appendChild(resultWrap);

    // counts both 진행중/완료 — anything already scanned in, regardless of whether
    // the alba has finished the pickup yet.
    const { data, error } = await sb.rpc('list_sessions_for_range', { p_date_from: summaryDateFrom, p_date_to: summaryDateTo, p_status: null });
    resultWrap.innerHTML = '';
    if(error){ resultWrap.appendChild(h('div',{class:'err',text:error.message})); return; }
    const list = data || [];
    if(list.length===0){ resultWrap.appendChild(h('div',{class:'muted',text:t('none')})); return; }
    const card = buildQtySummaryCard(list);
    if(card) resultWrap.appendChild(card);
    else resultWrap.appendChild(h('div',{class:'muted',text:t('none')}));
  }

  boot();
}

// =====================================================================
if(isAlbaCode) renderAlbaView(); else renderAdminView();
</script>
