<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#f0ede6; --fg:#2a2622; --muted:#7a7265;
  --border:#e2ddd3; --accent:#b4552f; --accent-fg:#ffffff; --danger:#b23b3b; --danger-fg:#fff;
  --success:#3f7a4e; --success-fg:#fff; --chip:#efe6da;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --surface:#262320; --surface-2:#2d2a25; --fg:#eee8df; --muted:#a69b8c;
    --border:#3a362f; --accent:#d97a4e; --accent-fg:#1c1a17; --danger:#e06060; --danger-fg:#1c1a17;
    --success:#6cc789; --success-fg:#1c1a17; --chip:#33302a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#262320; --surface-2:#2d2a25; --fg:#eee8df; --muted:#a69b8c;
  --border:#3a362f; --accent:#d97a4e; --accent-fg:#1c1a17; --danger:#e06060; --danger-fg:#1c1a17;
  --success:#6cc789; --success-fg:#1c1a17; --chip:#33302a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Noto Sans SC',-apple-system,sans-serif;padding:16px;padding-block:24px;max-width:640px;margin:0 auto;}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg);font-size:14px;font-family:inherit;margin-bottom:12px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;border:1px solid transparent;padding:10px 14px;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-fg);width:100%}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pill{display:inline-block;background:var(--chip);color:var(--fg);font-size:11.5px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.err{color:var(--danger);font-size:12.5px;margin:-4px 0 10px}
.ok{color:var(--success);font-size:12.5px;margin:-4px 0 10px}
.muted{color:var(--muted);font-size:12.5px}
.copybox{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-all;margin-bottom:8px;max-height:260px;overflow-y:auto}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.flexbetween{display:flex;justify-content:space-between;align-items:center;gap:8px}
.itemline{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.itemline:last-child{border-bottom:none}
.qtybox{display:flex;align-items:center;gap:8px}
.qtybox button{width:34px;height:34px;padding:0;font-size:16px;flex:none}
.qtybox input{width:56px;flex:none;text-align:center;margin-bottom:0;padding:8px 4px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-size:13px;font-weight:600}
.chip-btn.selected{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.statusbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.statusbadge.in_progress{background:var(--chip);color:var(--accent)}
.statusbadge.done{background:var(--chip);color:var(--success)}
.langsw{display:flex;gap:6px}
.langsw button{padding:5px 10px;font-size:12px}
.hidden{display:none!important}
.lockmsg{text-align:center;padding:40px 10px;color:var(--muted)}
.inapp-banner{background:var(--chip);border-bottom:1px solid var(--border);padding:10px 16px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.inapp-banner button{flex:none;white-space:nowrap}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.sumhead .label{font-size:12.5px;color:var(--muted);font-weight:700}
.sumhead .bignum{font-size:30px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.sumhead .bignum .u{font-size:14px;color:var(--muted);font-weight:700;margin-left:2px}
.sumtable{width:100%;border-collapse:collapse}
.sumtable th,.sumtable td{padding:9px 7px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtable th{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.sumtable td:first-child,.sumtable th:first-child{text-align:left;padding-left:2px}
.sumtable td:nth-child(2){text-align:left;font-size:12px}
.sumtable tbody tr:nth-child(even){background:var(--surface-2)}
.sumtable tfoot td{font-weight:800;font-size:15px;background:var(--chip);border-top:2px solid var(--border);border-bottom:none;color:var(--accent)}
.sumtable .storecell{font-weight:700;color:var(--fg)}
.sumtable .qtycell{font-weight:700}
.sumtable .qtycell.zero{color:var(--muted);font-weight:400;opacity:.45}
.colorsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid var(--border)}
.sumwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
</style>

// ---------- escape in-app browsers (KakaoTalk etc.) ----------
(function(){
  try{
    const ua = navigator.userAgent || '';
    const isKakao = /KAKAOTALK/i.test(ua);
    const isOtherWebview = /FBAN|FBAV|Instagram|NAVER|Line\//i.test(ua);
    if(isKakao){
      // KakaoTalk supports this scheme to hand the current URL to the device's default browser.
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    }
    if(isKakao || isOtherWebview){
      const banner = document.getElementById('inappBanner');
      if(banner){
        banner.style.display = 'flex';
        const msg = document.createElement('span');
        msg.textContent = '앱 내 브라우저에서는 일부 기능이 제한될 수 있어요.';
        const btn = document.createElement('button');
        btn.className = 'btn-ghost btn-sm';
        btn.textContent = '외부 브라우저로 열기';
        btn.onclick = function(){
          if(isKakao){
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
          } else {
            const url = location.href;
            const done = ()=>alert('링크가 복사되었습니다. 브라우저 앱(Chrome/Safari)을 열어 주소창에 붙여넣어주세요.');
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(url).then(done).catch(done);
            } else { done(); }
          }
        };
        banner.appendChild(msg);
        banner.appendChild(btn);
      }
    }
  }catch(e){}
})();

// ---------- helpers ----------
function h(tag, attrs, children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'text') el.textContent = attrs[k];
    else if(k === 'html') el.innerHTML = attrs[k];
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) el.appendChild(c); });
  return el;
}
async function copyText(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    flashBtn(btn, '복사됨!');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      flashBtn(btn, '복사됨!');
    }catch(e2){ flashBtn(btn, '복사 실패'); }
  }
}
function flashBtn(btn, msg){
  if(!btn) return;
  const old = btn.textContent;
  btn.textContent = msg;
  setTimeout(()=>{ btn.textContent = old; }, 1200);
}
function fmtDate(iso, zh){
  try{ const d = new Date(iso); return d.toLocaleString(zh ? 'zh-CN' : 'ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function fmtShortDate(iso){
  try{ const d = new Date(iso+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
  catch(e){ return iso; }
}
function fmtWon(n){
  if(n === null || n === undefined || n === '') return '';
  const num = Number(n);
  if(isNaN(num)) return '';
  return num.toLocaleString('ko-KR');
}
function buildCopyText(list, groupBy){
  // 같은 날짜는 한 번만, 같은 매장도 한 번만 표시하고 아래에 모델 · 용량 · 색상 x수량만 나열
  const sorted = [...list].sort((a,b)=>
    (a.purchase_date||'').localeCompare(b.purchase_date||'') ||
    (a.store_name||'').localeCompare(b.store_name||'') ||
    (a.created_at||'').localeCompare(b.created_at||'')
  );
  const cardOf = p => [p.card_company, p.card_last4].filter(Boolean).join(' ');
  const itemOf = (p, withCard) => {
    const spec = [p.model, p.capacity, p.color].filter(Boolean).join(' · ') || '-';
    return `${spec} x${p.qty}` + (withCard && cardOf(p) ? ` (${cardOf(p)})` : '');
  };
  // 한 매장 묶음: 카드가 하나뿐이면 매장 이름 옆에 한 번만, 여러 개면 줄마다 표시
  const block = (storeName, rows) => {
    const cards = [...new Set(rows.map(cardOf).filter(Boolean))];
    const single = cards.length === 1;
    const out = [];
    if(storeName !== null) out.push(`[${storeName}]` + (single ? ` ${cards[0]}` : ''));
    else if(single) out.push(cards[0]);
    rows.forEach(p=>out.push(itemOf(p, !single)));
    return out;
  };
  const by = (arr, keyFn) => { const m = new Map(); arr.forEach(x=>{ const k = keyFn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
  const lines = [];
  if(groupBy==='day'){
    by(sorted, p=>fmtShortDate(p.purchase_date)).forEach((dayRows, day)=>{
      lines.push(`■ ${day}`);
      by(dayRows, p=>p.store_name||'-').forEach((rows, store)=>{ lines.push(...block(store, rows)); });
      lines.push('');
    });
  } else {
    by(sorted, p=>p.store_name||'-').forEach((storeRows, store)=>{
      lines.push(`■ ${store}`);
      by(storeRows, p=>fmtShortDate(p.purchase_date)).forEach((rows, day)=>{
        lines.push(day);
        lines.push(...block(null, rows));
      });
      lines.push('');
    });
  }
  return lines.join('\n').trim();
}

function selectOf(options, placeholder){
  const sel = h('select',{});
  if(placeholder) sel.appendChild(h('option',{value:'',text:placeholder}));
  options.forEach(o=>sel.appendChild(h('option',{value:o,text:o})));
  return sel;
}

function chipGroup(options, initial, onChange){
  let value = initial || '';
  const wrap = h('div',{class:'chiprow'});
  let buttons = [];
  function build(opts){
    wrap.innerHTML = '';
    buttons = opts.map(opt=>{
      const b = h('button',{type:'button', class:'chip-btn'+(opt===value?' selected':''), text:opt});
      b.onclick = ()=>{
        value = opt;
        buttons.forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        if(onChange) onChange(value);
      };
      wrap.appendChild(b);
      return b;
    });
  }
  build(options);
  return {
    el: wrap,
    get value(){ return value; },
    set value(v){ value=v; buttons.forEach(b=>b.classList.toggle('selected', b.textContent===v)); },
    setOptions(opts, keepIfPresent){
      if(!(keepIfPresent && opts.includes(value))) value = '';
      build(opts);
    }
  };
}

    ordersCard.appendChild(h('div',{class:'copybox mono',text: orderLines || '-'}));
    app.appendChild(ordersCard);

    // note: account/pickup-link info is not shown here — that belongs to the
    // separate Apple pickup flow (already given in the guide message sent
    // beforehand). This page is only for recording what was picked up.
    app.appendChild(h('div',{class:'muted',style:'margin-bottom:12px',text:t.wechatNote}));

    // item entry card
    const itemCard = h('div',{class:'card'});
    itemCard.appendChild(h('label',{text:t.itemsTitle}));
    const modelSel = chipGroup(MODEL_OPTIONS, '', (m)=>colorSel.setOptions(colorOptionsFor(m)));
    const capSel = chipGroup(CAPACITY_OPTIONS);
    const colorSel = chipGroup(colorOptionsFor(MODEL_OPTIONS[0]));
    itemCard.appendChild(h('label',{text:t.model})); itemCard.appendChild(modelSel.el);
    itemCard.appendChild(h('label',{text:t.capacity})); itemCard.appendChild(capSel.el);
    itemCard.appendChild(h('label',{text:t.color})); itemCard.appendChild(colorSel.el);

    const qtyInput = h('input',{type:'number',min:'1',step:'1',value:'1'});
    itemCard.appendChild(h('label',{text:t.qty}));
    itemCard.appendChild(h('div',{class:'qtybox'},[
      h('button',{class:'btn-ghost',text:'-',onclick:()=>{ const v=Math.max(1,(parseInt(qtyInput.value)||1)-1); qtyInput.value=String(v); }}),
      qtyInput,
      h('button',{class:'btn-ghost',text:'+',onclick:()=>{ const v=(parseInt(qtyInput.value)||0)+1; qtyInput.value=String(v); }})
    ]));
    const addErr = h('div',{class:'err hidden'});
    itemCard.appendChild(addErr);
    const addBtn = h('button',{class:'btn-primary',text:t.add});
    addBtn.onclick = async ()=>{
      addErr.className='err hidden'; addErr.textContent='';
      if(!modelSel.value){ addErr.textContent = (lang==='ko'?'모델을 선택해주세요':'请选择型号'); addErr.className='err'; return; }
      if(!capSel.value){ addErr.textContent = (lang==='ko'?'용량을 선택해주세요':'请选择容量'); addErr.className='err'; return; }
      if(!colorSel.value){ addErr.textContent = (lang==='ko'?'색상을 선택해주세요':'请选择颜色'); addErr.className='err'; return; }
      const qty = parseInt(qtyInput.value) || 0;
      if(qty < 1){ addErr.textContent = (lang==='ko'?'수량을 확인해주세요':'请确认数量'); addErr.className='err'; return; }
      addBtn.disabled = true;
      const { error } = await sb.rpc('add_item_by_code', {
        p_code: code, p_model: modelSel.value, p_capacity: capSel.value,
        p_color: colorSel.value, p_qty: qty
      });
      addBtn.disabled = false;
      if(error){ addErr.textContent = error.message; addErr.className='err'; return; }
      await load();
    };
    itemCard.appendChild(addBtn);
    app.appendChild(itemCard);

    // added items list
    const listCard = h('div',{class:'card'});
    listCard.appendChild(h('label',{text:t.addedItems}));
    const items = session.items || [];
    if(items.length === 0){
      listCard.appendChild(h('div',{class:'muted',text:t.none}));
    }else{
      items.forEach(it=>{
        listCard.appendChild(h('div',{class:'itemline'},[
          h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim()}),
          h('span',{class:'pill',text:'x'+it.qty})
        ]));
      });
    }
    app.appendChild(listCard);

    // completion card
    const doneCard = h('div',{class:'card'});
    doneCard.appendChild(h('label',{text:t.arrive}));
    const arriveInput = h('input',{type:'time'});
    doneCard.appendChild(arriveInput);
    doneCard.appendChild(h('label',{text:t.complete}));
    const completeInput = h('input',{type:'time'});
    doneCard.appendChild(completeInput);
    doneCard.appendChild(h('label',{text:t.alipay}));
    const alipayInput = h('input',{placeholder:t.alipayPh});
    doneCard.appendChild(alipayInput);
    doneCard.appendChild(h('label',{text:t.realName}));
    const nameInput2 = h('input',{placeholder:t.realNamePh});
    doneCard.appendChild(nameInput2);

    // live-built WeChat report text — this is also what gets saved as the record's note,
    // so the admin/managers see exactly what was sent.
    doneCard.appendChild(h('label',{text:t.wechatReportLabel,style:'margin-top:10px'}));
    const reportBox = h('div',{class:'copybox mono'});
    doneCard.appendChild(reportBox);
    const reportCopyBtn = h('button',{class:'btn-ghost',text:t.copyReport,style:'width:100%'});
    reportCopyBtn.onclick = ()=>copyText(reportBox.textContent, reportCopyBtn);
    doneCard.appendChild(reportCopyBtn);
    doneCard.appendChild(h('div',{class:'muted',style:'margin:6px 0 0',text:t.fillTimesHint}));

    function buildReportText(){
      const totalQty = items.reduce((a,i)=>a+i.qty,0);
      const orderCount = (session.order_numbers||[]).length;
      const alipay = alipayInput.value.trim();
      const name = nameInput2.value.trim();
      const arrive = arriveInput.value || '';
      const complete = completeInput.value || '';
      return `${alipay || '-'},${name || '-'}\n${arrive || '-'}픽업시작 ${orderCount}건 ${totalQty}대 수령 ${complete || '-'}퇴근`;
    }
    function refreshReport(){ reportBox.textContent = buildReportText(); }
    [arriveInput, completeInput, alipayInput, nameInput2].forEach(inp=>inp.addEventListener('input', refreshReport));
    refreshReport();

    const confirmBox = h('div',{class:'hidden'});
    const finishErr = h('div',{class:'err hidden'});
    doneCard.appendChild(finishErr);

    const finishBtn = h('button',{class:'btn-primary',text:t.finish,style:'margin-top:10px'});
    finishBtn.onclick = ()=>{
      confirmBox.className = '';
      confirmBox.innerHTML = '';
      confirmBox.appendChild(h('div',{class:'muted',style:'margin-bottom:8px',text:t.finishConfirm}));
      const row = h('div',{class:'row'});
      const yesBtn = h('button',{class:'btn-primary',text:t.yes});
      yesBtn.onclick = async ()=>{
        yesBtn.disabled = true; finishErr.className='err hidden';
        const { error } = await sb.rpc('complete_session_by_code', {
          p_code: code, p_arrive: arriveInput.value || '', p_complete: completeInput.value || '', p_note: buildReportText()
        });
        if(error){ finishErr.textContent = error.message; finishErr.className='err'; yesBtn.disabled=false; return; }
        await load();
      };
      const noBtn = h('button',{class:'btn-ghost',text:t.cancel, onclick:()=>{ confirmBox.className='hidden'; }});
      row.appendChild(yesBtn); row.appendChild(noBtn);
      confirmBox.appendChild(row);
    };
    doneCard.appendChild(finishBtn);
    doneCard.appendChild(confirmBox);
    app.appendChild(doneCard);
  }

  load();
}

  function t(key, vars){
    let s = (AT[lang] && AT[lang][key] != null) ? AT[lang][key] : (AT.ko[key]||key);
    if(vars) Object.keys(vars).forEach(k=>{ s = s.replace('{'+k+'}', vars[k]); });
    return s;
  }
  function setLang(l){
    lang = l;
    try{ localStorage.setItem('pm_admin_lang', l); }catch(e){}
    if(session) drawDashboard(); else drawLogin();
  }
  function langSwitcher(){
    return h('div',{class:'langsw'},[
      h('button',{class:'btn-ghost'+(lang==='ko'?' btn-primary':''), text:'한국어', onclick:()=>setLang('ko')}),
      h('button',{class:'btn-ghost'+(lang==='zh'?' btn-primary':''), text:'中文', onclick:()=>setLang('zh')})
    ]);
  }

  async function boot(){
    const { data } = await sb.auth.getSession();
    session = data.session;
    if(session) await afterLogin(); else drawLogin();
  }

  function drawLogin(){
    app.innerHTML = '';
    app.appendChild(h('div',{class:'topbar'},[
      h('div',{},[h('h1',{text:t('brand')}), h('div',{class:'sub',text:t('adminLogin')})]),
      langSwitcher()
    ]));
    const card = h('div',{class:'card'});
    const email = h('input',{type:'email',placeholder:t('email')});
    const pw = h('input',{type:'password',placeholder:t('password')});
    const err = h('div',{class:'err hidden'});
    card.appendChild(h('label',{text:t('email')})); card.appendChild(email);
    card.appendChild(h('label',{text:t('password')})); card.appendChild(pw);
    card.appendChild(err);
    const btn = h('button',{class:'btn-primary',text:t('login')});
    btn.onclick = async ()=>{
      err.className='err hidden'; btn.disabled=true; btn.textContent=t('loggingIn');
      const { data, error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
      btn.disabled=false; btn.textContent=t('login');
      if(error){ err.textContent = t('loginFail',{msg:error.message}); err.className='err'; return; }
      session = data.session;
      await afterLogin();
    };
    pw.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });
    card.appendChild(btn);
    app.appendChild(card);
  }

  async function afterLogin(){
    const [{ data: storeData, error: storeErr }, { data: profData, error: profErr }, { data: settingsData, error: settingsErr }] = await Promise.all([
      sb.rpc('list_stores'), sb.rpc('get_my_profile'), sb.rpc('get_app_settings')
    ]);
    if(!storeErr) stores = storeData || [];
    storeZh = {}; stores.forEach(s=>{ if(s.name_zh) storeZh[s.name] = s.name_zh; });
    if(!profErr) myProfile = profData;
    if(!settingsErr && settingsData) appSettings = settingsData;
    drawDashboard();
  }

  function drawDashboard(){
    if(progressTimer){ clearInterval(progressTimer); progressTimer = null; }
    app.innerHTML = '';
    const top = h('div',{class:'topbar'},[
      h('div',{},[h('h1',{text:t('brand')}), h('div',{class:'sub',text:(myProfile&&myProfile.display_name)||session.user.email})]),
      h('div',{style:'display:flex;align-items:center;gap:8px'},[
        langSwitcher(),
        h('button',{class:'btn-ghost btn-sm',text:t('logout'),onclick: async ()=>{ await sb.auth.signOut(); session=null; drawLogin(); }})
      ])
    ]);
    app.appendChild(top);

    const isPart = !!(myProfile && myProfile.role === 'part'); // 시간제 알바 계정: 구매 기록만 사용
    if(isPart) section = 'purchase';
    const sectionRow = h('div',{class:'tabs',style:'margin-bottom:6px'});
    [['alba',t('sectionAlba')],['purchase',t('sectionPurchase')],['supplier',t('sectionSupplier')],['backup',t('sectionBackup')]].filter(([key])=>!isPart||key==='purchase').forEach(([key,label])=>{
      const tb = h('div',{class:'tab'+(section===key?' active':''), text:label, onclick:()=>{ section=key; drawDashboard(); }});
      sectionRow.appendChild(tb);
    });
    app.appendChild(sectionRow);

    if(section==='alba') drawAlbaSection();
    else if(section==='purchase') drawPurchaseSection();
    else if(section==='supplier') drawSupplierSection();
    else drawBackupSection();
  }

  function drawAlbaSection(){
    const tabs = h('div',{class:'tabs'});
    [['send',t('tabSend')],['progress',t('tabProgress')],['done',t('tabDone')],['summary',t('tabSummary')],['stores',t('tabStores')]].forEach(([key,label])=>{
      const tb = h('div',{class:'tab'+(activeTab===key?' active':''), text:label, onclick:()=>{ activeTab=key; drawDashboard(); }});
      tabs.appendChild(tb);
    });
    app.appendChild(tabs);

    const body = h('div',{id:'tabbody'});
    app.appendChild(body);
    if(activeTab==='send') drawSendTab(body);
    else if(activeTab==='progress') drawListTab(body, 'in_progress');
    else if(activeTab==='done') drawListTab(body, 'done');
    else if(activeTab==='summary') drawQtySummaryTab(body);
    else drawStoreSettingsTab(body);
  }

  function drawStoreSettingsTab(body){
    // One shared pickup account — the same account/link is used for every store,
    // so this is a single global form rather than per-store settings.
    const card = h('div',{class:'card'});
    card.appendChild(h('label',{text:t('storeSettings')}));
    card.appendChild(h('div',{class:'muted',style:'margin:-2px 0 10px',text:t('storeSaveHint')}));

    const linkInput = h('input',{placeholder:'https://...', value: appSettings.pickup_link || ''});
    const idInput = h('input',{placeholder:'', value: appSettings.account_id || ''});
    const pwInput = h('input',{placeholder:'', value: appSettings.account_pw || ''});
    card.appendChild(h('label',{text:t('pickupLink')})); card.appendChild(linkInput);
    card.appendChild(h('label',{text:t('accountId')})); card.appendChild(idInput);
    card.appendChild(h('label',{text:t('accountPw')})); card.appendChild(pwInput);

    const msg = h('div',{class:'ok hidden'});
    card.appendChild(msg);
    const btn = h('button',{class:'btn-primary',text:t('save')});
    btn.onclick = async ()=>{
      msg.className = 'hidden';
      btn.disabled = true; const oldText = btn.textContent; btn.textContent = t('saving');
      const { error } = await sb.rpc('update_app_settings', {
        p_account_id: idInput.value.trim(), p_account_pw: pwInput.value.trim(), p_pickup_link: linkInput.value.trim()
      });
      btn.disabled = false; btn.textContent = oldText;
      if(error){ msg.className='err'; msg.textContent = error.message; return; }
      appSettings = { account_id: idInput.value.trim(), account_pw: pwInput.value.trim(), pickup_link: linkInput.value.trim() };
      msg.className = 'ok'; msg.textContent = t('storeSaveDone');
    };
    card.appendChild(btn);
    body.appendChild(card);

    const zhCard = h('div',{class:'card'});
    zhCard.appendChild(h('label',{text:t('storeZhTitle')}));
    zhCard.appendChild(h('div',{class:'muted',style:'margin:-2px 0 10px',text:t('storeZhHint')}));
    const zhInputs = {};
    stores.forEach(st=>{
      zhCard.appendChild(h('label',{text:st.name,style:'margin-top:6px'}));
      const inp = h('input',{placeholder:'中文', value: st.name_zh || ''});
      zhInputs[st.id] = inp; zhCard.appendChild(inp);
    });
    const zhMsg = h('div',{class:'ok hidden'});
    zhCard.appendChild(zhMsg);
    const zhBtn = h('button',{class:'btn-primary',text:t('save')});
    zhBtn.onclick = async ()=>{
      zhMsg.className='hidden'; zhBtn.disabled=true; const old=zhBtn.textContent; zhBtn.textContent=t('saving');
      let failed = null;
      for(const st of stores){
        const v = zhInputs[st.id].value.trim();
        if((st.name_zh||'') === v) continue;
        const { error } = await sb.rpc('update_store_name_zh', { p_store_id: st.id, p_name_zh: v });
        if(error){ failed = error; break; }
        st.name_zh = v || null;
        if(v) storeZh[st.name] = v; else delete storeZh[st.name];
      }
      zhBtn.disabled=false; zhBtn.textContent=old;
      if(failed){ zhMsg.className='err'; zhMsg.textContent=failed.message; return; }
      zhMsg.className='ok'; zhMsg.textContent=t('storeSaveDone');
    };
    zhCard.appendChild(zhBtn);
    body.appendChild(zhCard);
  }

  function drawPurchaseSection(){
    const isAdmin = myProfile && myProfile.role === 'admin';
    if(isAdmin){
      const tabs = h('div',{class:'tabs'});
      [['mine',t('tabMine')],['all',t('tabAll')]].forEach(([key,label])=>{
        const tb = h('div',{class:'tab'+(purchaseTab===key?' active':''), text:label, onclick:()=>{ purchaseTab=key; drawDashboard(); }});
        tabs.appendChild(tb);
      });
      app.appendChild(tabs);
    }
    const body = h('div',{id:'tabbody'});
    app.appendChild(body);
    if(!isAdmin || purchaseTab==='mine') drawMyPurchaseTab(body);
    else drawAllPurchaseTab(body);
  }

  function rowRightCell(row, kind, reload){
    const cell = h('span',{style:'display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end'});
    cell.appendChild(h('span',{class:'pill',text:'x'+row.qty}));
    if(!canEditAll()) return cell;
    const eb = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('edit')});
    eb.onclick = ()=>{
      editFromAll = true;
      if(kind==='purchase'){ editingPurchase = row; purchaseTab = 'mine'; }
      else { editingSupplier = row; supplierTab = 'mine'; }
      drawDashboard(); window.scrollTo({top:0,behavior:'smooth'});
    };
    cell.appendChild(eb);
    const vb = h('button',{type:'button',class:'btn-danger btn-sm',text:t('cancel')});
    let armed = false;
    vb.onclick = async ()=>{
      if(!armed){ armed=true; vb.textContent=t('confirmVoid'); setTimeout(()=>{armed=false; vb.textContent=t('cancel');},3000); return; }
      vb.disabled = true;
      const { error } = kind==='purchase'
        ? await sb.rpc('void_purchase', { p_purchase_id: row.id })
        : await sb.rpc('void_supplier_order', { p_order_id: row.id });
      if(error){ vb.disabled=false; vb.textContent=error.message; return; }
      reload();
    };
    cell.appendChild(vb);
    return cell;
  }

  function drawTargetCard(body){
    const card = h('div',{class:'card'});
    const canSet = !!(myProfile && myProfile.role === 'admin');
    const head = h('div',{class:'flexbetween'});
    head.appendChild(h('label',{text:t('targetTitle'),style:'margin:0'}));
    const dInput = h('input',{type:'date',value:progressDate,style:'max-width:150px'});
    head.appendChild(dInput); card.appendChild(head);
    const list = h('div',{style:'margin-top:8px'}); card.appendChild(list);
    const foot = h('div',{class:'muted',style:'margin-top:6px;font-size:12px',text:t('targetAuto')}); card.appendChild(foot);
    const editorWrap = h('div'); card.appendChild(editorWrap);
    let rows = [], editing = false;
    async function load(){
      const { data, error } = await sb.rpc('get_daily_progress', { p_date: dInput.value });
      if(error) return;
      rows = data || []; renderList();
    }
    function renderList(){
      list.innerHTML = '';
      if(!rows.length){ list.appendChild(h('div',{class:'muted',text:t('targetNone')})); return; }
      rows.forEach(r=>{
        const left = r.target - r.bought;
        const spec = [r.model, r.capacity, r.color].filter(Boolean).join(' · ');
        const status = left>0 ? t('targetLeft')+' '+left : (left===0 ? t('targetDone') : t('targetOver',{n:-left}));
        list.appendChild(h('div',{class:'flexbetween',style:'padding:7px 0;border-bottom:1px solid var(--border);gap:8px'},[
          h('span',{text:spec,style:'min-width:0'}),
          h('span',{style:'font-weight:700;white-space:nowrap;'+(left<0?'color:var(--danger)':''),text:r.bought+' / '+r.target+'  ·  '+status})
        ]));
      });
    }
    dInput.onchange = ()=>{ progressDate = dInput.value; load(); };
    if(canSet){
      const setBtn = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('targetSet'),style:'margin-top:8px'});
      card.insertBefore(setBtn, editorWrap);
      setBtn.onclick = ()=>{
        if(editing){ editing=false; editorWrap.innerHTML=''; setBtn.textContent=t('targetSet'); return; }
        editing = true; setBtn.textContent = t('targetClose');
        const lines = rows.map(r=>({model:r.model,capacity:r.capacity,color:r.color,qty:String(r.target)}));
        if(!lines.length) lines.push({model:'',capacity:'',color:'',qty:''});
        const mk = (opts,val,ph,on)=>{ const sel=h('select',{}); sel.appendChild(h('option',{value:'',text:ph})); opts.forEach(o=>sel.appendChild(h('option',{value:o,text:o}))); sel.value=val||''; sel.onchange=()=>on(sel.value); return sel; };
        const wrap = h('div',{style:'margin-top:8px'});
        const msg = h('div',{class:'muted',style:'margin-top:6px'});
        function draw(){
          wrap.innerHTML='';
          lines.forEach((l,i)=>{
            const box = h('div',{style:'border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:6px'});
            box.appendChild(h('div',{class:'row'},[ mk(MODEL_OPTIONS,l.model,t('model'),v=>{ l.model=v; l.color=''; draw(); }), mk(CAPACITY_OPTIONS,l.capacity,t('capacity'),v=>{ l.capacity=v; }) ]));
            const qi = h('input',{type:'number',min:'1',step:'1',placeholder:t('qty'),value:l.qty||''}); qi.oninput=()=>{ l.qty=qi.value; };
            const rm = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('removeLine')}); rm.onclick=()=>{ lines.splice(i,1); if(!lines.length) lines.push({model:'',capacity:'',color:'',qty:''}); draw(); };
            box.appendChild(h('div',{style:'margin-top:6px'},[ mk(colorOptionsFor(l.model||MODEL_OPTIONS[0]),l.color,t('color'),v=>{ l.color=v; }) ]));
            box.appendChild(h('div',{class:'row',style:'margin-top:6px'},[ qi, rm ]));
            wrap.appendChild(box);
          });
        }
        draw();
        const add = h('button',{type:'button',class:'btn-ghost',text:t('addLine'),style:'width:100%'});
        add.onclick = ()=>{ const last=lines[lines.length-1]; lines.push({model:last?last.model:'',capacity:'',color:'',qty:''}); draw(); };
        const save = h('button',{type:'button',class:'btn-primary',text:t('targetSave'),style:'margin-top:8px'});
        save.onclick = async ()=>{
          save.disabled = true;
          const items = lines.filter(l=>l.model&&l.capacity&&parseInt(l.qty)>0).map(l=>({model:l.model,capacity:l.capacity,color:l.color||'',qty:parseInt(l.qty)}));
          const { error } = await sb.rpc('set_daily_targets', { p_date: dInput.value, p_items: items });
          save.disabled = false;
          if(error){ msg.className='err'; msg.textContent=error.message; return; }
          editing=false; editorWrap.innerHTML=''; setBtn.textContent=t('targetSet'); load();
        };
        editorWrap.innerHTML=''; editorWrap.appendChild(wrap); editorWrap.appendChild(add); editorWrap.appendChild(save); editorWrap.appendChild(msg);
      };
    }
    body.appendChild(card);
    load();
    progressTimer = setInterval(()=>{ if(!editing) load(); }, 30000);
  }

  function drawMyPurchaseTab(body){
    const ed = editingPurchase; // snapshot; null when adding new
    if(!ed) drawTargetCard(body);
    const card = h('div',{class:'card'});
    card.appendChild(h('label',{text: ed ? t('editPurchase') : t('store')}));
    if(ed) card.appendChild(h('label',{text:t('store'),style:'margin-top:8px'}));
    const sel = h('select',{});
    stores.forEach(s=>sel.appendChild(h('option',{value:s.id,text:sn(s.name)})));
    if(ed) sel.value = ed.store_id;
    card.appendChild(sel);

    const modelSel = chipGroup(MODEL_OPTIONS, ed && ed.model, (m)=>colorSel.setOptions(colorOptionsFor(m)));
    const capSel = chipGroup(CAPACITY_OPTIONS, ed && ed.capacity);
    const colorSel = chipGroup(colorOptionsFor((ed && ed.model) || MODEL_OPTIONS[0]), ed && ed.color);
    card.appendChild(h('label',{text:t('model')})); card.appendChild(modelSel.el);
    card.appendChild(h('label',{text:t('capacity')})); card.appendChild(capSel.el);
    card.appendChild(h('label',{text:t('color')})); card.appendChild(colorSel.el);

    card.appendChild(h('label',{text:t('qty')}));
    const qtyInput = h('input',{type:'number',min:'1',step:'1',value: ed ? String(ed.qty) : '1'});
    card.appendChild(h('div',{class:'qtybox'},[
      h('button',{class:'btn-ghost',text:'-',onclick:()=>{ const v=Math.max(1,(parseInt(qtyInput.value)||1)-1); qtyInput.value=String(v); }}),
      qtyInput,
      h('button',{class:'btn-ghost',text:'+',onclick:()=>{ const v=(parseInt(qtyInput.value)||0)+1; qtyInput.value=String(v); }})
    ]));

          if(!m) warnMsg = t('warnNoTarget');
          else {
            const sameKey = ed && ed.purchase_date===dateInput.value && ed.model===modelSel.value && ed.capacity===capSel.value && (ed.color||'')===(colorSel.value||'');

            if(qty > left) warnMsg = t('warnOver',{a:Math.max(left,0), b:qty});
          }
          if(warnMsg && pendingWarn !== warnMsg){
            pendingWarn = warnMsg; err.textContent = warnMsg; err.className='err'; btn.textContent = t('saveAnyway'); return;

      btn.disabled=true; btn.textContent=t('saving');

    const copyCard = h('div',{class:'card'});

    const groupRow = h('div',{class:'chiprow'});

    const storeBtn = h('button',{type:'button',class:'chip-btn',text:t('byStore')});

    storeBtn.onclick = ()=>{ copyGroupBy='store'; storeBtn.classList.add('selected'); dayBtn.classList.remove('selected'); };
    groupRow.appendChild(dayBtn); groupRow.appendChild(storeBtn);
    copyCard.appendChild(groupRow);
    const copyErr = h('div',{class:'err hidden'});
    copyCard.appendChild(copyErr);
    const copyBtn = h('button',{class:'btn-primary',text:t('copy'),style:'margin-top:8px'});
    copyBtn.onclick = async ()=>{

      if(!copyFrom.value || !copyTo.value){ copyErr.textContent=t('selectPeriod'); copyErr.className='err'; return; }
      const oldText = copyBtn.textContent;

      copyBtn.disabled = false; copyBtn.textContent = oldText;

  function drawAllPurchaseTab(body){
    const ctrl = h('div',{class:'card'});
    const today = new Date().toISOString().slice(0,10);
    ctrl.appendChild(h('div',{class:'row'},[
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('fromDate')})); const i=h('input',{type:'date',value:today}); d.appendChild(i); d._input=i; return d; })(),
      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('toDate')})); const i=h('input',{type:'date',value:today}); d.appendChild(i); d._input=i; return d; })()
    ]));
    const rowEls = ctrl.querySelectorAll('.row');
    const fromInput = rowEls[0].children[0]._input;
    const toInput = rowEls[0].children[1]._input;
    ctrl.appendChild(h('label',{text:t('store')}));
    const storeSel = h('select',{});
    storeSel.appendChild(h('option',{value:'',text:t('allStores')}));
    stores.forEach(s=>storeSel.appendChild(h('option',{value:s.id,text:sn(s.name)})));
    ctrl.appendChild(storeSel);
    const loadBtn = h('button',{class:'btn-primary',text:t('query')});
    ctrl.appendChild(loadBtn);
    body.appendChild(ctrl);

    const resultWrap = h('div');
    body.appendChild(resultWrap);

    async function load(){
      resultWrap.innerHTML = '';
      resultWrap.appendChild(h('div',{class:'muted',text:t('loading')}));
      const [{ data, error }, { data: progData }] = await Promise.all([
        sb.rpc('admin_list_purchases', { p_date_from: fromInput.value, p_date_to: toInput.value, p_store_id: storeSel.value || null }),
        sb.rpc('get_daily_progress_range', { p_from: fromInput.value, p_to: toInput.value })
      ]);
      resultWrap.innerHTML = '';
      // 날짜별 목표 달성 현황 (목표가 등록된 날짜만 표시, 매장 필터와 상관없이 전체 구매 합산)
      if(progData && progData.length){
        const progCard = h('div',{class:'card'});
        progCard.appendChild(h('div',{style:'font-weight:700;margin-bottom:6px',text:t('targetAllTitle')}));
        const byDay = new Map();
        progData.forEach(r=>{ if(!byDay.has(r.target_date)) byDay.set(r.target_date, []); byDay.get(r.target_date).push(r); });
        byDay.forEach((list, day)=>{
          const allDone = list.every(r=>r.bought>=r.target);
          progCard.appendChild(h('div',{class:'flexbetween',style:'margin-top:8px'},[
            h('span',{style:'font-weight:600',text:fmtShortDate(day)}),
            h('span',{class:'pill',text: allDone ? t('targetAchieved') : list.reduce((a,r)=>a+Math.min(r.bought,r.target),0)+' / '+list.reduce((a,r)=>a+r.target,0)+t('unit')})
          ]));
          list.forEach(r=>{
            const left = r.target - r.bought;
            const spec = [r.model, r.capacity, r.color].filter(Boolean).join(' · ');
            const status = left>0 ? t('targetLeft')+' '+left : (left===0 ? t('targetAchieved') : t('targetOver',{n:-left}));
            progCard.appendChild(h('div',{class:'flexbetween',style:'padding:6px 0;border-bottom:1px solid var(--border);gap:8px'},[
              h('span',{text:spec,style:'min-width:0'}),
              h('span',{style:'font-weight:700;white-space:nowrap;'+(left<0?'color:var(--danger)':''),text:r.bought+' / '+r.target+'  ·  '+status})
            ]));
          });
        });
        resultWrap.appendChild(progCard);
      }
      if(error){ resultWrap.appendChild(h('div',{class:'err',text:error.message})); return; }
      const rows = data || [];
      if(rows.length===0){ resultWrap.appendChild(h('div',{class:'muted',text:t('noRecordsInPeriod')})); return; }

      const totalQty = rows.reduce((a,r)=>a+r.qty,0);
      resultWrap.appendChild(h('div',{class:'card'},[
        h('div',{style:'font-weight:700',text:t('totalCount',{n:rows.length,q:totalQty})})
      ]));

      // ---- 딩톡 업로드용 내보내기 ----
      (function(){
        const CARD_KEY = 'pm_card_numbers';
        const getSaved = ()=>{ try{ return localStorage.getItem(CARD_KEY) || ''; }catch(e){ return ''; } };
        const exp = h('div',{class:'card'});
        exp.appendChild(h('div',{style:'font-weight:700',text:t('dingTitle')}));
        exp.appendChild(h('div',{class:'muted',style:'margin:4px 0 8px;font-size:12.5px',text:t('dingDesc')}));
        exp.appendChild(h('label',{text:t('dingCards')}));
        const ta = h('textarea',{rows:'4',placeholder:'1234 5678 9012 8482\n...',style:'width:100%'});
        ta.value = getSaved();
        exp.appendChild(ta);
        exp.appendChild(h('div',{class:'muted',style:'font-size:12px;margin-bottom:8px',text:t('dingCardsHint')}));
        const msg = h('div',{class:'err',style:'white-space:pre-line;margin:0 0 8px'});
        function build(){
          try{ localStorage.setItem(CARD_KEY, ta.value); }catch(e){}
          const map = {}, dups = [];
          ta.value.split(/\n/).forEach(line=>{
            const digits = line.replace(/\D/g,'');
            if(digits.length < 12) return;
            const l4 = digits.slice(-4);
            if(map[l4] && map[l4]!==digits) dups.push(l4); else map[l4] = digits;
          });
          const agg = new Map();
          rows.forEach(r=>{
            const l4 = (r.card_last4||'').replace(/\D/g,'').slice(-4);
            // 딩톡 모델명 형식: iphone18pro 512GB burgundy kr spec / iphone duo 256GB night sky kr spec
            const mdl = /duo/i.test(r.model||'') ? 'iphone duo' : (r.model||'').toLowerCase().replace(/\s+/g,'');
            const label = [mdl, r.capacity, (r.color||'').toLowerCase(), 'kr spec'].filter(Boolean).join(' ');
            const key = l4+'|'+label;
            if(!agg.has(key)) agg.set(key,{l4,label,qty:0,unit:((DING_UNIT_PRICE[r.model]||{})[r.capacity])||null,name:[r.model,r.capacity].join(' ')});
            agg.get(key).qty += r.qty;
          });
          const missing = new Set(), noPrice = new Set();
          const out = [...agg.values()].sort((a,b)=>a.l4.localeCompare(b.l4)||a.label.localeCompare(b.label)).map(x=>{
            let card = '';
            if(x.l4){ card = map[x.l4] || ''; if(!card){ missing.add(x.l4); card = '****'+x.l4; } }
            if(x.unit==null) noPrice.add(x.name);
            return [x.label, x.qty, x.unit==null ? '' : x.unit*x.qty, '', card];
          });
          const warn = [];
          if(missing.size) warn.push(t('dingMissing',{n:[...missing].join(', ')}));
          if(noPrice.size) warn.push(t('dingNoPrice',{n:[...noPrice].join(', ')}));
          if(dups.length) warn.push(t('dingDupCard',{n:[...new Set(dups)].join(', ')}));
          if(fromInput.value !== toInput.value) warn.push(t('dingMulti'));
          msg.textContent = warn.join('\n');
          return out;
        }
        const btns = h('div',{class:'row'});
        const copyBtn = h('button',{type:'button',class:'btn-primary',text:t('dingCopy')});
        copyBtn.onclick = ()=>{ const out = build(); copyText(out.map(r=>r.join('\t')).join('\n'), copyBtn); };
        const xlsxBtn = h('button',{type:'button',class:'btn-ghost',text:t('dingXlsx')});
        xlsxBtn.onclick = async ()=>{
          const out = build();
          try{
            const X = await loadSheetJS();
            const ws = X.utils.aoa_to_sheet([['产品型号MODEL','下单数量QTY','下单金额AMOUNT','银行授权码BANK CODE','支付卡号CARD NUM'], ...out]);
            ws['!cols'] = [{wch:34},{wch:12},{wch:16},{wch:20},{wch:24}];
            const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Sheet1');
            X.writeFile(wb, 'dingtalk_'+fromInput.value+(fromInput.value!==toInput.value?'_'+toInput.value:'')+'.xlsx');
          }catch(e){ msg.textContent = t('backupLibFail'); }
        };
        btns.appendChild(copyBtn); btns.appendChild(xlsxBtn);
        exp.appendChild(msg); exp.appendChild(btns);
        resultWrap.appendChild(exp);
      })();

      // group by store -> by buyer
      const byStore = {};
      rows.forEach(r=>{
        byStore[r.store_name] = byStore[r.store_name] || {};
        byStore[r.store_name][r.buyer_name] = byStore[r.store_name][r.buyer_name] || [];
        byStore[r.store_name][r.buyer_name].push(r);
      });
      Object.keys(byStore).forEach(storeName=>{
        const buyers = byStore[storeName];
        const storeTotal = Object.values(buyers).flat().reduce((a,r)=>a+r.qty,0);
        const storeCard = h('div',{class:'card'});
        storeCard.appendChild(h('div',{class:'flexbetween'},[
          h('div',{style:'font-weight:700',text:sn(storeName)}),
          h('span',{class:'pill',text:storeTotal+t('unit')})
        ]));
        Object.keys(buyers).forEach(buyerName=>{
          const items = buyers[buyerName];
          const buyerTotal = items.reduce((a,r)=>a+r.qty,0);
          storeCard.appendChild(h('hr',{}));
          storeCard.appendChild(h('div',{class:'flexbetween'},[
            h('div',{style:'font-weight:600',text:buyerName}),
            h('span',{class:'pill',text:buyerTotal+t('unit')})
          ]));
          items.forEach(it=>{
            const cardInfo = [it.card_company, it.card_last4].filter(Boolean).join(' ');
            storeCard.appendChild(h('div',{class:'itemline'},[
              h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim() + ' · ' + it.purchase_date + (cardInfo?' · '+cardInfo:'')},[]),
              rowRightCell(it,'purchase',load)
            ]));
          });
        });
        resultWrap.appendChild(storeCard);
      });

      // model summary
      const byModel = {};
      rows.forEach(r=>{
        const key = `${r.model} ${r.capacity||''} ${r.color||''}`.replace(/\s+/g,' ').trim();
        byModel[key] = (byModel[key]||0) + r.qty;
      });
      const modelCard = h('div',{class:'card'});
      modelCard.appendChild(h('label',{text:t('modelTotal')}));
      Object.keys(byModel).forEach(key=>{
        modelCard.appendChild(h('div',{class:'itemline'},[h('span',{text:key}), h('span',{class:'pill',text:byModel[key]+t('unit')})]));
      });
      resultWrap.appendChild(modelCard);
    }
    loadBtn.onclick = load;
    load();
  }

  function loadSheetJS(){
    return new Promise((resolve,reject)=>{
      if(window.XLSX) return resolve(window.XLSX);
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = ()=> window.XLSX ? resolve(window.XLSX) : reject(new Error('xlsx'));
      sc.onerror = ()=> reject(new Error('xlsx'));
      document.head.appendChild(sc);
    });
  }

  function drawBackupSection(){
    const card = h('div',{class:'card'});
    card.appendChild(h('div',{style:'font-weight:700;font-size:16px',text:t('backupTitle')}));
    card.appendChild(h('div',{class:'muted',style:'margin:6px 0 12px',text:t('backupDesc')}));

    let fmt = 'xlsx', allPeriod = true;
    const mkChoice = (labelKey, options, getter, setter)=>{
      card.appendChild(h('label',{text:t(labelKey)}));
      const row = h('div',{class:'chiprow',style:'margin-bottom:10px'});
      const btns = {};
      options.forEach(([val,txt])=>{
        const b = h('button',{type:'button',class:'chip-btn'+(getter()===val?' selected':''),text:txt});
        b.onclick = ()=>{ setter(val); Object.keys(btns).forEach(k=>btns[k].classList.toggle('selected',k===String(val))); if(labelKey==='backupPeriod') rangeBox.style.display = (val===false)?'block':'none'; };
        btns[String(val)] = b; row.appendChild(b);
      });
      card.appendChild(row);
    };
    mkChoice('backupFormat',[['xlsx',t('backupXlsx')],['csv',t('backupCsv')]],()=>fmt,v=>{fmt=v;});

    const fromI = h('input',{type:'date',value:today}), toI = h('input',{type:'date',value:today});
    rangeBox.appendChild(h('div',{class:'row'},[
      (()=>{const d=h('div',{});d.appendChild(h('label',{text:t('fromDate')}));d.appendChild(fromI);return d;})(),
      (()=>{const d=h('div',{});d.appendChild(h('label',{text:t('toDate')}));d.appendChild(toI);return d;})()
    ]));
    mkChoice('backupPeriod',[[true,t('backupAll')],[false,t('backupRange')]],()=>allPeriod,v=>{allPeriod=v;});
    card.appendChild(rangeBox);

    const err = h('div',{class:'err hidden'});
    const ok = h('div',{class:'muted hidden',style:'margin-top:8px'});
    const btn = h('button',{class:'btn-primary',text:t('backupDownload')});
    card.appendChild(err); card.appendChild(btn); card.appendChild(ok);

    btn.onclick = async ()=>{
      err.className='err hidden'; ok.className='muted hidden';
      const old = btn.textContent; btn.disabled = true; btn.textContent = t('backupPreparing');
      try{
        const { data, error } = await sb.rpc('admin_export_all', {
          p_date_from: allPeriod ? null : fromI.value, p_date_to: allPeriod ? null : toI.value
        });

          ['알바품목', (data.session_items||[]).map(r=>({'생성일시':fmtTime(r.created_at),'매장':r.store_name,'알바명':r.alba_name,'모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty}))],
          ['구매기록', (data.purchases||[]).map(r=>({'구매일':r.purchase_date,'매장':r.store_name,'입력자':r.buyer_name||'','모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty,'카드회사':r.card_company||'','카드끝4자리':r.card_last4||'','메모':r.note||'','입력일시':fmtTime(r.created_at),'취소됨':r.voided?'Y':''}))],
          ['공급업체', (data.supplier_orders||[]).map(r=>({'받은날짜':r.received_date,'공급업체':r.company_name,'입력자':r.buyer_name||'','모델':r.model,'용량':r.capacity||'','색상':r.color||'','수량':r.qty,'단가(원)':r.unit_price===null||r.unit_price===undefined?'':Number(r.unit_price),'금액(원)':r.amount===null?'':Number(r.amount),'명세서ID':r.batch_id||'','메모':r.note||'','입력일시':fmtTime(r.created_at),'취소됨':r.voided?'Y':''}))],
          ['삭제된알바기록', (data.deleted_sessions||[]).map(r=>({'삭제일시':fmtTime(r.deleted_at),'삭제자':r.deleted_by_name||'','매장':r.store_name||'','알바명':r.alba_name||'','상태':r.status||'','생성일시':fmtTime(r.created_at),'제출내용':r.note||'','주문번호':r.orders||'','품목(원본)':r.items||''}))]
        ];
        const stamp = new Date().toISOString().slice(0,10);
        if(fmt==='xlsx'){
          let X; try{ X = await loadSheetJS(); }catch(e){ throw new Error(t('backupLibFail')); }
          const wb = X.utils.book_new();

            const ws = rows.length ? X.utils.json_to_sheet(rows) : X.utils.aoa_to_sheet([['(기록 없음)']]);
            if(rows.length) ws['!cols'] = Object.keys(rows[0]).map(k=>({wch:Math.min(40,Math.max(10,k.length*2+2))}));
            X.utils.book_append_sheet(wb, ws, name);
          });
          X.writeFile(wb, `pickup_backup_${stamp}.xlsx`);
        } else {
          const esc = v=> { const str = String(v===null||v===undefined?'':v); return /[",\n\r]/.test(str) ? '"'+str.replace(/"/g,'""')+'"' : str; };
          for(const [name,rows] of sheets){
            const cols = rows.length ? Object.keys(rows[0]) : ['(기록 없음)'];
            const lines = [cols.map(esc).join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(',')));
            const blob = new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pickup_backup_${sheets.findIndex(x=>x[0]===name)+1}_${stamp}.csv`;
            document.body.appendChild(a); a.click(); a.remove();
            await new Promise(r=>setTimeout(r,400));
          }

      }catch(e){ err.textContent = e.message || String(e); err.className='err'; }

    };

  function drawSupplierBatchForm(body){
    const card = h('div',{class:'card'});
    const scanFile = h('input',{type:'file',accept:'image/*',style:'display:none'});
    const scanBtn = h('button',{type:'button',class:'btn-primary',text:t('scanBtn'),style:'width:100%;margin-bottom:10px'});
    const scanMsg = h('div',{class:'muted',style:'margin-bottom:10px;white-space:pre-line'});
    if(SCAN_ENABLED){ card.appendChild(scanFile); card.appendChild(scanBtn); card.appendChild(scanMsg); }
    scanBtn.onclick = ()=>scanFile.click();
    card.appendChild(h('label',{text:t('companyName')}));
    const companyInput = h('input',{placeholder:t('companyNamePh')});
    card.appendChild(companyInput);
    card.appendChild(h('label',{text:t('receivedDate'),style:'margin-top:8px'}));
    const dateInput = h('input',{type:'date',value:new Date().toISOString().slice(0,10)});
    card.appendChild(dateInput);
    card.appendChild(h('label',{text:t('batchLines'),style:'margin-top:12px'}));

    const linesWrap = h('div');
    card.appendChild(linesWrap);
    const totalBox = h('div',{style:'margin-top:10px;font-weight:700;text-align:right'});
    const lines = []; // {model,capacity,color,qty,unit}
    const mkSelect = (opts, val, placeholder, onchg)=>{
      const sel = h('select',{});
      sel.appendChild(h('option',{value:'',text:placeholder}));
      opts.forEach(o=>sel.appendChild(h('option',{value:o,text:o})));
      sel.value = val||''; sel.onchange = ()=>onchg(sel.value);
      return sel;
    };
    function recalc(){
      const q = lines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
      const amt = lines.reduce((a,l)=>a+((parseInt(l.qty)||0)*(Number(l.unit)||0)),0);
      totalBox.textContent = t('batchTotal')+': '+q+t('unit')+(amt?' · '+fmtWon(amt)+t('wonUnit'):'');
      lines.forEach(l=>{ if(l._totalEl){ const v=(parseInt(l.qty)||0)*(Number(l.unit)||0); l._totalEl.textContent = v? t('lineTotal')+' '+fmtWon(v)+t('wonUnit') : ''; } });
    }
    function drawLines(){
      linesWrap.innerHTML = '';
      lines.forEach((l,i)=>{
        const box = h('div',{style:'border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px'});
        const top = h('div',{class:'flexbetween',style:'margin-bottom:6px'});
        top.appendChild(h('span',{class:'muted',style:'font-weight:700',text:'#'+(i+1)}));
        if(lines.length>1){
          const rm = h('button',{type:'button',class:'btn-ghost btn-sm',text:t('removeLine')});
          rm.onclick = ()=>{ lines.splice(i,1); drawLines(); };
          top.appendChild(rm);
        }
        box.appendChild(top);
        const colorSel = mkSelect(colorOptionsFor(l.model||MODEL_OPTIONS[0]), l.color, t('color'), v=>{ l.color=v; });
        box.appendChild(h('div',{class:'row'},[
          mkSelect(MODEL_OPTIONS, l.model, t('model'), v=>{ l.model=v; l.color=''; drawLines(); }),
          mkSelect(CAPACITY_OPTIONS, l.capacity, t('capacity'), v=>{ l.capacity=v; })
        ]));
        box.appendChild(h('div',{style:'margin-top:6px'},[colorSel]));
        const qtyI = h('input',{type:'number',min:'1',step:'1',placeholder:t('qty'),value:l.qty||''});
        qtyI.oninput = ()=>{ l.qty=qtyI.value; recalc(); };
        const unitI = h('input',{type:'number',min:'0',step:'1',placeholder:t('unitPrice'),value:l.unit||''});
        unitI.oninput = ()=>{ l.unit=unitI.value; recalc(); };
        box.appendChild(h('div',{class:'row',style:'margin-top:6px'},[qtyI, unitI]));
        l._totalEl = h('div',{class:'muted',style:'margin-top:4px;text-align:right'});
        box.appendChild(l._totalEl);
        linesWrap.appendChild(box);
      });
      recalc();
    }
    const addLine = (copyFrom)=>{
      lines.push({model:copyFrom?copyFrom.model:'', capacity:'', color:'', qty:'', unit:copyFrom?copyFrom.unit:''});
    };
    addLine(); drawLines();
    const shrinkImage = (file)=>new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = ()=>{
        const max = 2000, r = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',0.85).split(',')[1]);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
    scanFile.onchange = async ()=>{
      const f = scanFile.files && scanFile.files[0]; if(!f) return;
      scanBtn.disabled = true; scanMsg.className='muted'; scanMsg.textContent = t('scanning');
      try{
        const image = await shrinkImage(f);
        const { data, error } = await sb.functions.invoke('parse-statement', { body: { image, media_type:'image/jpeg' } });
        if(error || !data || !data.result){
          let noKey = false;
          try{ const j = await error.context.json(); noKey = j && j.error==='NO_API_KEY'; }catch(e){}
          scanMsg.className='err'; scanMsg.textContent = noKey ? t('scanNoKey') : t('scanFail'); return;
        }
        const r = data.result, warn = (r.warnings||[]).slice();
        if(r.company_name) companyInput.value = r.company_name;
        if(r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) dateInput.value = r.date;
        lines.length = 0;
        (r.items||[]).forEach(it=>lines.push({model:it.model||'', capacity:it.capacity||'', color:it.color||'', qty:it.qty?String(it.qty):'', unit:(it.unit_price==null?'':String(it.unit_price))}));
        if(lines.length===0) addLine();
        lines.forEach((l,i)=>{ if(!l.model||!l.capacity) warn.push(t('scanUnknownLine',{n:i+1})); });
        const sumQ = lines.reduce((a,l)=>a+(parseInt(l.qty)||0),0);
        if(r.total_qty && r.total_qty!==sumQ) warn.push(t('scanTotalMismatch',{a:r.total_qty,b:sumQ}));
        drawLines();
        scanMsg.className = warn.length ? 'err' : 'muted';
        scanMsg.textContent = t('scanDone') + (warn.length ? '\n'+warn.join('\n') : '');
      }catch(e){ scanMsg.className='err'; scanMsg.textContent = t('scanFail'); }
      finally{ scanBtn.disabled = false; scanFile.value=''; }
    };
    const addBtn = h('button',{type:'button',class:'btn-ghost',text:t('addLine'),style:'width:100%'});
    addBtn.onclick = ()=>{ addLine(lines[lines.length-1]); drawLines(); };
    card.appendChild(addBtn);
    card.appendChild(totalBox);

    card.appendChild(h('label',{text:t('noteOptional'),style:'margin-top:10px'}));
    const noteInput = h('input',{placeholder:''});
    card.appendChild(noteInput);
    const err = h('div',{class:'err hidden'});
    card.appendChild(err);
    const btn = h('button',{class:'btn-primary',text:t('registerBatch')});
    btn.onclick = async ()=>{
      err.className='err hidden';
      if(!companyInput.value.trim()){ err.textContent=t('selectCompanyName'); err.className='err'; return; }
      const filled = lines.map((l,i)=>({l,i})).filter(({l})=>l.model||l.capacity||l.color||l.qty||l.unit);
      if(filled.length===0){ err.textContent=t('batchNeedLine'); err.className='err'; return; }
      for(const {l,i} of filled){
        if(!l.model || !l.capacity || !(parseInt(l.qty)>0)){ err.textContent=t('batchCheckLine',{n:i+1}); err.className='err'; return; }
      }
      btn.disabled=true; btn.textContent=t('saving');
      const items = filled.map(({l})=>({model:l.model, capacity:l.capacity, color:l.color||'', qty:parseInt(l.qty), unit_price:l.unit===''?null:Number(l.unit)}));
      const { error } = await sb.rpc('add_supplier_batch', { p_company_name: companyInput.value.trim(), p_received_date: dateInput.value, p_note: noteInput.value.trim(), p_items: items });
      btn.disabled=false; btn.textContent=t('registerBatch');
      if(error){ err.textContent=error.message; err.className='err'; return; }
      drawDashboard();
    };
    card.appendChild(btn);
    body.appendChild(card);
  }

    card.appendChild(noteInput);

    card.appendChild(err);
    const btn = h('button',{class:'btn-primary',text: ed ? t('editDone') : t('addSupplier')});
    btn.onclick = async ()=>{
      err.className='err hidden';

      if(!modelSel.value){ err.textContent=t('selectModel'); err.className='err'; return; }

      // 같은 명세서(batch_id)로 등록한 줄은 한 카드에 모아서 보여준다
      const groups = []; const idx = {};
      list.forEach(p=>{

      });
      groups.forEach(g=>{
        const first = g.rows[0];

      (()=>{ const d=h('div',{}); d.appendChild(h('label',{text:t('fromDate')})); const i=h('input',{type:'date',value:today}); d.appendChild(i); d._input=i; return d; })(),

      resultWrap.innerHTML = '';

        p_date_from: fromInput.value, p_date_to: toInput.value, p_company_name: null
      });

      if(error){ resultWrap.appendChild(h('div',{class:'err',text:error.message})); return; }

      if(rows.length===0){ resultWrap.appendChild(h('div',{class:'muted',text:t('noRecordsInPeriod')})); return; }

      const totalQty = rows.reduce((a,r)=>a+r.qty,0);
      const totalAmount = rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
      resultWrap.appendChild(h('div',{class:'card'},[
        h('div',{style:'font-weight:700',text:t('totalCount',{n:rows.length,q:totalQty})}),
        h('div',{class:'muted',style:'margin-top:4px',text:t('totalAmount')+': '+fmtWon(totalAmount)+t('wonUnit')})
      ]));

      // group by company -> by buyer
      const byCompany = {};
      rows.forEach(r=>{
        byCompany[r.company_name] = byCompany[r.company_name] || {};
        byCompany[r.company_name][r.buyer_name] = byCompany[r.company_name][r.buyer_name] || [];
        byCompany[r.company_name][r.buyer_name].push(r);
      });
      Object.keys(byCompany).forEach(companyName=>{
        const buyers = byCompany[companyName];
        const items = Object.values(buyers).flat();
        const companyTotal = items.reduce((a,r)=>a+r.qty,0);
        const companyAmount = items.reduce((a,r)=>a+(Number(r.amount)||0),0);
        const companyCard = h('div',{class:'card'});
        companyCard.appendChild(h('div',{class:'flexbetween'},[
          h('div',{style:'font-weight:700',text:companyName},[]),
          h('span',{class:'pill',text:companyTotal+t('unit')})
        ]));
        companyCard.appendChild(h('div',{class:'muted',style:'margin-top:2px',text:t('totalAmount')+': '+fmtWon(companyAmount)+t('wonUnit')}));
        Object.keys(buyers).forEach(buyerName=>{
          const buyerItems = buyers[buyerName];
          const buyerTotal = buyerItems.reduce((a,r)=>a+r.qty,0);
          companyCard.appendChild(h('hr',{}));
          companyCard.appendChild(h('div',{class:'flexbetween'},[
            h('div',{style:'font-weight:600',text:buyerName}),
            h('span',{class:'pill',text:buyerTotal+t('unit')})
          ]));
          const bGroups = []; const bIdx = {};
          buyerItems.forEach(it=>{
            const key = it.batch_id || ('single:'+it.id);
            if(!(key in bIdx)){ bIdx[key]=bGroups.length; bGroups.push([]); }
            bGroups[bIdx[key]].push(it);
          });
          bGroups.forEach(grp=>{
            const gAmt = grp.reduce((a,r)=>a+(Number(r.amount)||0),0);
            const gQty = grp.reduce((a,r)=>a+r.qty,0);
            companyCard.appendChild(h('div',{class:'muted',style:'margin-top:8px;font-size:12px;font-weight:700',
              text:[fmtShortDate(grp[0].received_date), grp.length>1?t('statementOf')+' '+t('lines',{n:grp.length}):'', gQty+t('unit'), gAmt?fmtWon(gAmt)+t('wonUnit'):''].filter(Boolean).join(' · ')}));
            grp.slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).forEach(it=>{
              const priceStr = it.amount!=null ? ' · '+(it.unit_price!=null?fmtWon(it.unit_price)+'×'+it.qty+' = ':'')+fmtWon(it.amount)+t('wonUnit') : '';
              companyCard.appendChild(h('div',{class:'itemline'},[
                h('span',{text:`${it.model} ${it.capacity||''} ${it.color||''}`.replace(/\s+/g,' ').trim() + priceStr},[]),
                rowRightCell(it,'supplier',load)
              ]));
            });
          });
        });
        resultWrap.appendChild(companyCard);
      });

      // model summary
      const byModel = {};
      rows.forEach(r=>{
        const key = `${r.model} ${r.capacity||''} ${r.color||''}`.replace(/\s+/g,' ').trim();
        byModel[key] = (byModel[key]||0) + r.qty;
      });
      const modelCard = h('div',{class:'card'});
      modelCard.appendChild(h('label',{text:t('modelTotal')}));
      Object.keys(byModel).forEach(key=>{
        modelCard.appendChild(h('div',{class:'itemline'},[h('span',{text:key}), h('span',{class:'pill',text:byModel[key]+t('unit')})]));
      });
      resultWrap.appendChild(modelCard);
    }
    loadBtn.onclick = load;
    load();
  }
